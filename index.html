const IN_WECHAT = typeof navigator !== "undefined" && /MicroMessenger/i.test(navigator.userAgent || "");

function ElectricityCard({ myRoom, onEditRoom }) {
  const [sid, setSid] = useLocalState("xmum_student_id", "");
  const room = myRoom || "";
  const [mode, setMode] = useLocalState("xmum_ref1_mode_v2", "room");
  const [deep, setDeep] = useLocalState("xmum_elec_deep", "");
  const [editLink, setEditLink] = useState(false);
  const [guide, setGuide] = useState(false);
  const [toast, setToast] = useState("");
  const [biller, setBiller] = useLocalState("xmum_biller_v2", BILLER_CODE);
  const [editBiller, setEditBiller] = useState(false);
  const toastT = useRef(null);
  const showToast = (m) => { setToast(m); clearTimeout(toastT.current); toastT.current = setTimeout(() => setToast(""), 3500); };
  const [copiedKey, copy] = useCopy();

  const clean = (s) => s.replace(/[^A-Za-z0-9-]/g, "").toUpperCase();
  const idC = clean(sid);
  const roomC = clean(room);
  const ref1 = mode === "id" ? idC : roomC;
  const ref2 = mode === "id" ? roomC : idC;
  const ready = ref1.length >= 2;
  const billerC = (biller || BILLER_CODE).replace(/\s+/g, "");
  const allText = "Biller Code: " + billerC + "\nRef-1: " + ref1 + (ref2 ? "\nRef-2: " + ref2 : "");
  const deepUrl = normalizeUrl(deep);
  const portalHref = deepUrl || DEFAULT_ELECTRICITY_URL;

  const launchTng = async () => {
    if (!ready) return;
    const ok = await copyText(ref1);
    showToast(ok ? "📋 宿舍账单号已自动复制！打开 TNG 后直接在 JomPAY 粘贴" : "⚠️ 自动复制失败，请点“仅复制 Ref-1”或在下方手动复制");
    if (IN_WECHAT) { setGuide(true); return; }
    setGuide(false);
    let left = false;
    const mark = () => { left = true; };
    const onVis = () => { if (document.hidden) left = true; };
    document.addEventListener("visibilitychange", onVis);
    window.addEventListener("pagehide", mark);
    window.addEventListener("blur", mark);
    try { window.location.href = TNG_SCHEME; } catch (err) { /* 忽略，走兜底 */ }
    setTimeout(() => {
      document.removeEventListener("visibilitychange", onVis);
      window.removeEventListener("pagehide", mark);
      window.removeEventListener("blur", mark);
      if (!left && !document.hidden) setGuide(true);
    }, 1500);
  };
  const btnBase = "flex min-h-[48px] items-center justify-center gap-1.5 rounded-xl px-3 py-2.5 text-sm font-bold transition-colors ";

  return (
    <div className="flex flex-col gap-3">
      {/* 方式一：JomPAY */}
      <Card className="border-emerald-400/40">
        <CardTitle
          icon={<I.Zap size={18} />}
          title="宿舍电费 · JomPAY 极速缴费"
          tone="bg-emerald-400/15 text-emerald-300"
          right={<span className="shrink-0 rounded-full bg-emerald-400 px-2 py-0.5 text-[11px] font-bold text-zinc-950">推荐 · 免排队</span>}
        />

        <div className="grid grid-cols-1 gap-3 min-[420px]:grid-cols-2">
          <div className="min-w-0">
            <label htmlFor="sid" className={labelCls}>学号</label>
            <input id="sid" type="text" autoComplete="off" autoCapitalize="characters" autoCorrect="off" value={sid}
              onChange={(e) => setSid(e.target.value)} className={inputCls + " tnum"} placeholder="例如 SWE2309123" />
          </div>
          <div className="min-w-0">
            <p className={labelCls}>我的宿舍</p>
            <div className="flex min-h-[46px] items-center justify-between gap-2 rounded-xl border border-zinc-700 bg-zinc-950 px-3 py-2">
              <span className={"whitespace-nowrap font-mono text-base font-semibold " + (room ? "text-zinc-50" : "text-zinc-500")}>{room || "未设置"}</span>
              <button type="button" onClick={onEditRoom} className="shrink-0 rounded-lg border border-zinc-600 px-2.5 py-1 text-xs font-semibold text-zinc-100 active:bg-zinc-800">{room ? "修改" : "去设置"}</button>
            </div>
          </div>
        </div>

                {(/\s/.test(sid) || (sid && !/^[A-Za-z]{2,}\d{4,}$/.test(sid.trim()))) && (
          <p className="mt-2 rounded-lg border border-amber-400/40 bg-amber-400/10 px-3 py-2 text-xs leading-relaxed text-amber-200" role="alert">
            ⚠️ 学号形如 SWE2309123，空格符号会自动去掉，请核对。
          </p>
        )}

        <div className="mt-3 flex items-center justify-between gap-3">
          <span className="text-xs text-zinc-400">Ref-1 使用</span>
          <div className="inline-flex overflow-hidden rounded-lg border border-zinc-700 text-xs">
            <button type="button" onClick={() => setMode("id")} aria-pressed={mode === "id"}
              className={"min-h-[36px] px-3 py-1.5 " + (mode === "id" ? "bg-sky-400 font-semibold text-zinc-950" : "bg-zinc-950 text-zinc-300")}>学号</button>
            <button type="button" onClick={() => setMode("room")} aria-pressed={mode === "room"}
              className={"min-h-[36px] px-3 py-1.5 " + (mode === "room" ? "bg-sky-400 font-semibold text-zinc-950" : "bg-zinc-950 text-zinc-300")}>房间号</button>
          </div>
        </div>

        <div className="mt-3 overflow-hidden rounded-xl border border-zinc-800 bg-zinc-950">
          <CopyRow label="Biller Code" value={billerC} copyKey="bc" copiedKey={copiedKey} copy={copy} accent="text-amber-300" />
          <CopyRow label="Ref-1" value={ref1} copyKey="r1" copiedKey={copiedKey} copy={copy} />
          <CopyRow label="Ref-2（可选）" value={ref2} copyKey="r2" copiedKey={copiedKey} copy={copy} />
        </div>

        <div className="mt-3 flex gap-2">
          <button type="button" disabled={!ready} onClick={launchTng}
            className={btnBase + "min-w-0 flex-1 " + (ready ? "bg-sky-400 text-zinc-950 active:bg-sky-300" : "cursor-not-allowed bg-zinc-800 text-zinc-500")}>
            ⚡ 复制账号并打开 TNG eWallet
          </button>
          <button type="button" disabled={!ready} onClick={() => ready && copy("r1big", ref1)}
            className={btnBase + "shrink-0 whitespace-nowrap border " + (copiedKey === "r1big" ? "border-emerald-400 bg-emerald-400 text-zinc-950" : ready ? "border-zinc-600 text-zinc-100 active:bg-zinc-800" : "cursor-not-allowed border-zinc-800 text-zinc-600")}>
            {copiedKey === "r1big" ? "✅ 已复制" : "📋 仅复制 Ref-1"}
          </button>
        </div>
        {!ready && <p className="mt-2 text-xs text-zinc-400">先填宿舍号或学号</p>}

        {guide && ready && (
          <div className="mt-2 rounded-xl border border-sky-400/40 bg-zinc-950 p-3" role="group" aria-label="手动缴费步骤">
            <div className="flex items-start justify-between gap-2">
              <p className="text-sm font-semibold text-zinc-50">{IN_WECHAT ? "微信内无法直接唤起，请按步骤操作" : "没有自动打开 TNG？两步搞定"}</p>
              <button type="button" onClick={() => setGuide(false)} aria-label="关闭"
                className="flex h-8 w-8 shrink-0 items-center justify-center rounded-lg border border-zinc-700 text-zinc-300 active:bg-zinc-800"><I.X size={14} /></button>
            </div>
            <ol className="mt-2 flex flex-col gap-2">
              <li className="flex items-center justify-between gap-2">
                <span className="text-xs text-zinc-300">Step 1</span>
                <button type="button" onClick={() => copy("g-bc", billerC)}
                  className={"min-h-[40px] whitespace-nowrap rounded-lg border px-3 py-1.5 text-sm font-semibold " + (copiedKey === "g-bc" ? "border-emerald-400 bg-emerald-400 text-zinc-950" : "border-zinc-600 text-zinc-100 active:bg-zinc-800")}>
                  {copiedKey === "g-bc" ? "✅ 已复制" : "一键复制 Biller " + billerC}
                </button>
              </li>
              <li className="flex items-center justify-between gap-2">
                <span className="text-xs text-zinc-300">Step 2</span>
                <button type="button" onClick={() => copy("g-r1", ref1)}
                  className={"min-h-[40px] whitespace-nowrap rounded-lg border px-3 py-1.5 font-mono text-sm font-semibold " + (copiedKey === "g-r1" ? "border-emerald-400 bg-emerald-400 text-zinc-950" : "border-zinc-600 text-zinc-100 active:bg-zinc-800")}>
                  {copiedKey === "g-r1" ? "✅ 已复制" : "一键复制 " + ref1}
                </button>
              </li>
              <li className="flex items-center justify-between gap-2">
                <span className="text-xs text-zinc-300">Step 3</span>
                <span className="text-sm text-zinc-100">手动打开 TNG，搜索 JomPAY</span>
              </li>
            </ol>
            {IN_WECHAT && <p className="mt-2 text-xs text-amber-200">请先切回手机桌面再打开 TNG。</p>}
          </div>
        )}

        <div className="mt-2 flex items-center justify-between gap-2 text-xs text-zinc-400">
          <span className="min-w-0">🏢 线下：A3 楼 711 室</span>
          <button type="button" onClick={() => setEditBiller(!editBiller)} className="shrink-0 rounded-lg border border-zinc-700 px-2.5 py-1 text-xs text-zinc-300 active:bg-zinc-800">改 Biller Code</button>
        </div>
        {editBiller && (
          <div className="mt-2">
            <label htmlFor="biller-in" className={labelCls}>Biller Code（以你的账单为准）</label>
            <input id="biller-in" type="text" inputMode="numeric" value={biller} onChange={(ev) => setBiller(ev.target.value.replace(/[^0-9]/g, ""))} className={inputCls + " font-mono tnum"} placeholder={BILLER_CODE} />
          </div>
        )}

        <div className="mt-3 flex items-start gap-2 rounded-xl border border-emerald-400/30 bg-emerald-400/5 px-3 py-2">
          <span className="mt-0.5 shrink-0 text-emerald-300"><I.Shield size={18} /></span>
          <p className="text-xs leading-relaxed text-zinc-200">🔒 安全声明：本工具仅提供官方账单信息格式化辅助，不接触任何支付接口或账户隐私。转账全流程在您本人的手机银行/电子钱包内完成，资金由 PayNet 直达学校对公账户。</p>
        </div>
      </Card>

      {toast && (
        <div role="status" aria-live="polite" style={{ position: "fixed", left: 16, right: 16, bottom: "max(16px, env(safe-area-inset-bottom))", zIndex: 60 }}
          className="mx-auto max-w-sm rounded-xl border border-emerald-400/50 bg-zinc-900 px-4 py-3 text-center text-sm font-medium text-zinc-50 shadow-lg">{toast}</div>
      )}

      {/* 方式二：备用直通 */}
      <Card className="!p-3.5">
        <div className="flex items-center justify-between gap-3">
          <div className="min-w-0">
            <p className="text-xs font-semibold text-zinc-400">方式二 · 备用</p>
            <p className="text-sm text-zinc-200">直达电费缴费页</p>
          </div>
          <button type="button" onClick={() => setEditLink(!editLink)} aria-label="设置直达链接"
            className="flex h-10 w-10 shrink-0 items-center justify-center rounded-lg border border-zinc-700 text-zinc-300 active:bg-zinc-800"><I.Pencil size={15} /></button>
        </div>
        <a href={portalHref} target="_blank" rel="noopener noreferrer"
          className="mt-3 flex min-h-[48px] items-center justify-center gap-2 rounded-xl bg-amber-400 px-4 py-2.5 text-sm font-bold text-zinc-950 active:bg-amber-300">
          🔌 直通电费缴费页
        </a>
        {!deepUrl && <p className="mt-2 text-xs text-zinc-400">未设置链接时打开学校主页，点笔图标可填写。</p>}
        {editLink && (
          <div className="mt-3">
            <label htmlFor="deep-url" className={labelCls}>电费缴费页链接（深层地址）</label>
            <input id="deep-url" type="url" inputMode="url" autoCapitalize="none" autoCorrect="off" value={deep}
              onChange={(e) => setDeep(e.target.value)} className={inputCls} placeholder="https://" />
          </div>
        )}
      </Card>
    </div>
  );
}

/* ------------------------------ 5. 场景化交通倒计时（3 行卡片 + 指南抽屉） ------------------------------ */
/* 参考时刻表，以校方与 ERL 官方最新公告为准 */
const T_SHUTTLE_WD = ["07:30", "08:00", "08:30", "09:00", "10:00", "12:00", "13:00", "15:00", "17:00", "18:00", "19:30", "21:00", "22:00"];
const T_SHUTTLE_WE = ["09:00", "11:00", "14:00", "17:00", "20:00", "22:00"];
const T_CITY_WD = every(5, 30, 23, 30, 30);
const T_CITY_WE = every(6, 0, 23, 30, 45);
const T_AIR_WD = every(5, 45, 23, 15, 30);
const T_AIR_WE = every(6, 15, 23, 15, 45);
function urgency(secs) {
  if (secs < 300) return "text-red-300";
  if (secs < 900) return "text-amber-300";
  return "text-emerald-300";
}
const isWeekend = (dow) => dow === 0 || dow === 6;

const SCENES = [
  {
    key: "station", emoji: "🚌", title: "去火车站 / 蹭接驳车", spot: "正门警卫室上车 → Salak Tinggi ERL 站",
    sched: (dow) => (isWeekend(dow) ? T_SHUTTLE_WE : T_SHUTTLE_WD), wd: T_SHUTTLE_WD, we: T_SHUTTLE_WE,
    fare: "校内接驳按校方安排，票价/是否收费以公告为准。",
  },
  {
    key: "city", emoji: "🚅", title: "去市区逛街", spot: "Salak Tinggi 站 → KL Sentral",
    sched: (dow) => (isWeekend(dow) ? T_CITY_WE : T_CITY_WD), wd: T_CITY_WD, we: T_CITY_WE,
    fare: "ERL Transit 单程票价以 ERL 官网/售票机为准；可用 Touch 'n Go 卡或 eWallet 的相关功能。",
  },
  {
    key: "air", emoji: "✈️", title: "去机场坐飞机", spot: "Salak Tinggi 站 → KLIA 1 / KLIA 2",
    sched: (dow) => (isWeekend(dow) ? T_AIR_WE : T_AIR_WD), wd: T_AIR_WD, we: T_AIR_WE,
    fare: "ERL 到 KLIA 1 / KLIA 2 的票价以 ERL 官网为准；国际航班建议提前 3 小时到机场。",
  },
];

function leftText(secs) {
  const m = Math.floor(secs / 60);
  if (m < 1) return "马上发车";
  if (m >= 60) return "还有 " + Math.floor(m / 60) + " 小时 " + (m % 60) + " 分钟发车";
  return "还有 " + m + " 分钟发车";
}

function SceneCard({ sc, now }) {
  const sec = Math.floor(now.getTime() / 1000);
  const list = useMemo(() => upcoming(sc.sched, now, 2), [sec, sc]);
  const first = list[0];
  const second = list[1];
  const today = sc.sched(now.getDay());
  const isLast = !!first && first.off === 0 && first.t === today[today.length - 1];
  const hot = !!first && first.off === 0 && first.secs < 600;
  return (
    <div className={"rounded-xl border px-3 py-2.5 " + (hot ? "border-orange-400 bg-orange-400/10" : "border-zinc-800 bg-zinc-950")}
      data-scene={sc.key}>
      <div className="flex items-center justify-between gap-2">
        <p className="min-w-0 truncate text-sm font-semibold text-zinc-50"><span aria-hidden="true">{sc.emoji}</span> {sc.title}</p>
        {first ? (
          <p className={"tnum shrink-0 text-sm font-bold " + (hot ? "text-orange-300" : urgency(first.secs))}>
            {first.off > 0 ? "明早 " + first.t : leftText(first.secs)}
          </p>
        ) : <p className="shrink-0 text-sm text-zinc-400">暂无班次</p>}
      </div>
      <p className="mt-0.5 truncate text-xs text-zinc-400">{sc.spot}</p>
      <p className="tnum mt-0.5 flex flex-wrap gap-x-3 text-xs text-zinc-300">
        {first ? <span>下一班 {first.off > 0 ? "明天 " : ""}{first.t}{second ? " · 再下一班 " + (second.off > 0 ? "明天 " : "") + second.t : ""}</span> : null}
        {hot && <span className="font-semibold text-orange-300">⚠️ 快发车了，抓紧出门</span>}
        {isLast && !hot && <span className="font-semibold text-amber-300">🔔 今天的末班</span>}
        {first && first.off > 0 && <span className="text-amber-300">今天已收班</span>}
      </p>
    </div>
  );
}

function TransitGuide({ onClose }) {
  const [day, setDay] = useState(isWeekend(new Date().getDay()) ? "we" : "wd");
  return (
    <div className="mb-3 rounded-xl border border-sky-400/40 bg-zinc-950 p-3" role="region" aria-label="交通指南">
      <div className="flex items-center justify-between gap-2">
        <p className="text-sm font-semibold text-zinc-50">ℹ️ 出行指南</p>
        <button type="button" onClick={onClose} aria-label="收起指南"
          className="flex h-8 w-8 items-center justify-center rounded-lg border border-zinc-700 text-zinc-300 active:bg-zinc-800"><I.X size={14} /></button>
      </div>
      <p className="mt-2 text-xs font-semibold text-sky-300">票价</p>
      <ul className="mt-1 list-disc space-y-1 pl-5 text-xs leading-relaxed text-zinc-300">
        {SCENES.map((s) => <li key={s.key}>{s.emoji} {s.fare}</li>)}
      </ul>
      <p className="mt-3 text-xs font-semibold text-sky-300">乘车贴士</p>
      <ul className="mt-1 list-disc space-y-1 pl-5 text-xs leading-relaxed text-zinc-300">
        <li>接驳车在正门警卫室附近上车，提前 5 分钟到，别踩点。</li>
        <li>ERL 站内检票后看清楚是去 KL Sentral 还是 KLIA 的方向。</li>
        <li>雷阵雨天出行带伞，末班前留足缓冲时间。</li>
        <li>倒计时用的是你手机当前时间，遇到节假日加班/停班请以公告为准。</li>
      </ul>
      <div className="mt-3 flex items-center justify-between gap-2">
        <p className="text-xs font-semibold text-sky-300">完整班次表（参考）</p>
        <div className="inline-flex overflow-hidden rounded-lg border border-zinc-700 text-xs">
          <button type="button" onClick={() => setDay("wd")} aria-pressed={day === "wd"}
            className={"min-h-[32px] px-3 py-1 " + (day === "wd" ? "bg-sky-400 font-semibold text-zinc-950" : "bg-zinc-950 text-zinc-300")}>工作日</button>
          <button type="button" onClick={() => setDay("we")} aria-pressed={day === "we"}
            className={"min-h-[32px] px-3 py-1 " + (day === "we" ? "bg-sky-400 font-semibold text-zinc-950" : "bg-zinc-950 text-zinc-300")}>周末</button>
        </div>
      </div>
      {SCENES.map((s) => (
        <div key={s.key} className="mt-2">
          <p className="text-xs font-semibold text-zinc-200">{s.emoji} {s.title}</p>
          <p className="tnum mt-1 flex flex-wrap gap-1">
            {(day === "wd" ? s.wd : s.we).map((t) => <span key={t} className="rounded border border-zinc-700 px-1.5 py-0.5 text-[11px] text-zinc-200">{t}</span>)}
          </p>
        </div>
      ))}
    </div>
  );
}

function TransitCard({ now }) {
  const [guide, setGuide] = useState(false);
  return (
    <Card>
      <CardTitle icon={<I.Bus size={18} />} title="出行 · 还有多久发车" tone="bg-emerald-400/15 text-emerald-300"
        right={
          <button type="button" onClick={() => setGuide(!guide)} aria-expanded={guide}
            className={"inline-flex min-h-[36px] shrink-0 items-center gap-1 rounded-lg border px-2.5 py-1 text-xs font-semibold " + (guide ? "border-sky-400 bg-sky-400/15 text-sky-100" : "border-zinc-600 text-zinc-100 active:bg-zinc-800")}>
            ℹ️ 指南
          </button>
        } />
      {guide && <TransitGuide onClose={() => setGuide(false)} />}
      <div className="flex flex-col gap-2">
        {SCENES.map((sc) => <SceneCard key={sc.key} sc={sc} now={now} />)}
      </div>
      <p className="mt-2 text-xs text-zinc-400">班次为参考，以校方公告为准。</p>
    </Card>
  );
}

function cleanStr(v, max) {
  return typeof v === "string" ? v.replace(/[\r\n\t]+/g, " ").trim().slice(0, max) : "";
}

/* 导入时的严格清洗：只认已知楼宇与楼层，限制长度与数量 */
function sanitizeMap(raw) {
  const out = {};
  let nb = 0, nt = 0;
  const src = raw && typeof raw === "object" ? (raw.buildings && typeof raw.buildings === "object" ? raw.buildings : raw) : {};
  BUILDINGS.forEach((b) => {
    const s = src[b.id];
    if (!s || typeof s !== "object") return;
    const d = {};
    if (typeof s.hours === "string") d.hours = cleanStr(s.hours, 200);
    if (typeof s.tips === "string") d.tips = cleanStr(s.tips, 400);
    if (s.fdesc && typeof s.fdesc === "object") {
      const fd = {};
      FLOORS.forEach((f) => { const t = cleanStr(s.fdesc[f], 120); if (t) fd[f] = t; });
      if (Object.keys(fd).length) d.fdesc = fd;
    }
    if (s.floors && typeof s.floors === "object") {
      const fl = {};
      FLOORS.forEach((f) => {
        const arr = Array.isArray(s.floors[f]) ? s.floors[f].slice(0, 120) : [];
        const tags = [];
        arr.forEach((t) => {
          if (!t || typeof t !== "object") return;
          const name = cleanStr(t.name, 40);
          if (!name) return;
          const kind = KINDS.some((k) => k.key === t.kind) ? t.kind : "other";
          tags.push({ id: uid(), name: name, kind: kind, note: cleanStr(t.note, 300) });
        });
        if (tags.length) { fl[f] = tags; nt += tags.length; }
      });
      if (Object.keys(fl).length) d.floors = fl;
    }
    if (Object.keys(d).length) { out[b.id] = d; nb++; }
  });
  return { data: out, nb: nb, nt: nt };
}

function mergeMap(cur, inc) {
  const out = { ...cur };
  Object.keys(inc).forEach((id) => {
    const a = cur[id] || {};
    const b = inc[id];
    const m = { ...a };
    if (b.hours !== undefined) m.hours = b.hours;
    if (b.tips !== undefined) m.tips = b.tips;
    if (b.fdesc) m.fdesc = { ...(a.fdesc || {}), ...b.fdesc };
    if (b.floors) {
      const fl = { ...(a.floors || {}) };
      Object.keys(b.floors).forEach((f) => {
        const have = fl[f] || [];
        const keys = {};
        have.forEach((t) => { keys[t.name + "|" + t.kind] = true; });
        const add = b.floors[f].filter((t) => !keys[t.name + "|" + t.kind]);
        fl[f] = have.concat(add);
      });
      m.floors = fl;
    }
    out[id] = m;
  });
  return out;
}

function countTags(data) {
  let n = 0;
  Object.keys(data).forEach((id) => {
    const fl = (data[id] && data[id].floors) || {};
    Object.keys(fl).forEach((f) => { n += fl[f].length; });
  });
  return n;
}

function exportMapJson(data) {
  const b = {};
  Object.keys(data).forEach((id) => {
    const r = data[id] || {};
    const o = {};
    if (r.hours !== undefined) o.hours = r.hours;
    if (r.tips !== undefined) o.tips = r.tips;
    if (r.fdesc) {
      const fd = {};
      Object.keys(r.fdesc).forEach((f) => { if (r.fdesc[f]) fd[f] = r.fdesc[f]; });
      if (Object.keys(fd).length) o.fdesc = fd;
    }
    if (r.floors) {
      o.floors = {};
      Object.keys(r.floors).forEach((f) => {
        if (r.floors[f].length) o.floors[f] = r.floors[f].map((t) => ({ name: t.name, kind: t.kind, note: t.note || "" }));
      });
    }
    if (o.floors && !Object.keys(o.floors).length) delete o.floors;
    if (Object.keys(o).length) b[id] = o;
  });
  return JSON.stringify({ app: "xmum-helper", version: 3, exportedAt: new Date().toISOString(), buildings: b }, null, 2);
}

    window.addEventListener("keydown", onKey);
    return () => window.removeEventListener("keydown", onKey);
  }, [onClose]);

  const doImport = (replace) => {
    let raw;
    try { raw = JSON.parse(paste); } catch (e) { setMsg({ ok: false, t: "这不是有效的 JSON，请确认完整粘贴了朋友导出的内容。" }); return; }
    const r = sanitizeMap(raw);

    setData(replace ? r.data : mergeMap(data, r.data));

    fr.onerror = () => setMsg({ ok: false, t: "读取文件失败。" });
    fr.readAsText(f);

        style={{ paddingBottom: "env(safe-area-inset-bottom, 0px)" }}>

          </div>

            className="flex h-10 w-10 items-center justify-center rounded-lg border border-zinc-700 text-zinc-200 active:bg-zinc-800"><I.X size={18} /></button>
        </div>

          <textarea id="map-export" readOnly rows={5} value={json} onFocus={(e) => e.target.select()}
            className={inputCls + " mt-2 resize-y font-mono text-xs leading-relaxed"} aria-label="导出的地图 JSON" />
          <button type="button" onClick={() => copy("json", json)}
            className={"mt-2 flex min-h-[46px] w-full items-center justify-center gap-2 rounded-xl px-4 py-2.5 text-base font-semibold " +
              (copiedKey === "json" ? "bg-emerald-400 text-zinc-950" : "bg-sky-400 text-zinc-950 active:bg-sky-300")}>
            {copiedKey === "json" ? <><I.Check size={18} /> 已复制</> : <><I.Copy size={18} /> 复制 JSON，发给朋友</>}
          </button>

          <div className="my-5 flex items-center gap-3 text-xs text-zinc-400">
            <span className="h-px flex-1 bg-zinc-800" />导入<span className="h-px flex-1 bg-zinc-800" />
          </div>

          <label htmlFor="map-import" className={labelCls}>粘贴朋友导出的 JSON</label>
          <textarea id="map-import" rows={5} value={paste} onChange={(e) => { setPaste(e.target.value); setMsg(null); }}
            className={inputCls + " resize-y font-mono text-xs leading-relaxed"} placeholder={'{ "app": "xmum-helper", "buildings": { ... } }'} />
          <div className="mt-2 flex flex-wrap items-center gap-2">

            <button type="button" disabled={!paste.trim()} onClick={() => doImport(true)}
              className={"min-h-[46px] rounded-xl border px-3 py-2.5 text-sm font-semibold " + (paste.trim() ? "border-zinc-500 text-zinc-100 active:bg-zinc-800" : "cursor-not-allowed border-zinc-800 text-zinc-600")}>覆盖我的数据</button>
          </div>
          {msg && <p role="status" className={"mt-3 rounded-lg border px-3 py-2 text-sm leading-relaxed " + (msg.ok ? "border-emerald-400/40 bg-emerald-400/10 text-emerald-200" : "border-red-400/40 bg-red-400/10 text-red-200")}>{msg.t}</p>}
          <p className="mt-3 text-xs leading-relaxed text-zinc-400">合并会保留你已有的标签，只追加朋友多出来的；导入内容会被检查并限制长度，不会执行任何代码。</p>

    for (let i = 0; i < n; i++) wins.push(<rect key={i} x={x + 8 + i * gap + 4} y={y + d + 6} width={gap - 8} height={Math.max(8, h - 12)} rx="3" fill="rgba(255,255,255,0.30)" />);
  }
  const top = extraTop || 0;
  return (
    <g className={"b3" + (selected ? " b3-sel" : "")} style={{ "--glow": c.glow }} role="button" tabIndex={0}

          onClick={() => onPick("stadium")} onKeyDown={(e) => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); onPick("stadium"); } }}>
          <rect x="420" y="526" width="200" height="104" rx="30" fill="#000" fillOpacity="0" pointerEvents="all" />
          <ellipse cx="530" cy="594" rx="90" ry="38" fill="#5b3f2e" pointerEvents="none" />
          <g className="roof" pointerEvents="none">
            <ellipse cx="530" cy="582" rx="90" ry="38" fill="#c79470" stroke="#6b4429" strokeWidth="3.5" />

          <RoofText x={712} y={417} t="LY3" size={24} />
          <RoofText x={685} y={433} t="二饭" size={16} />
        </Block3>

        {/* 东侧下：D6 第一食堂（D 区宿舍群旁） */}
        <Block3 id="d6" zh={nameOf("d6")} x={625} y={496} w={120} d={54} h={24} c={C3.orange} selected={P("d6")} onPick={onPick} windows>
          <text x={655} y={530} fontSize="24" pointerEvents="none">🍛</text>
          <RoofText x={710} y={527} t="D6" size={24} />
          <RoofText x={685} y={543} t="一饭" size={16} />
        </Block3>

        {/* 宿舍区：只作天际线背景，不可点击 */}
        <g aria-hidden="true" pointerEvents="none" opacity="0.55">
          {[640, 672, 704, 736].map((hx) => (
            <g key={hx}>
              <rect x={hx} y={600} width="26" height="22" rx="4" fill="rgba(255,255,255,0.10)" stroke="rgba(255,255,255,0.28)" strokeWidth="2" />
              <rect x={hx - 2} y={594} width="30" height="10" rx="5" fill="rgba(255,255,255,0.16)" stroke="rgba(255,255,255,0.28)" strokeWidth="2" />
            </g>
          ))}
          <text x="705" y="592" textAnchor="middle" fontSize="20" fontWeight="700" fill="rgba(255,255,255,0.75)">🏠 宿舍群 (D/LY)</text>
        </g>

        {/* A3 主楼 · 图书馆：中轴顶端，最大体量，带钟楼 */}
        <Block3 id="a3" zh={nameOf("a3")} x={290} y={70} w={220} d={100} h={36} c={C3.gold} selected={P("a3")} onPick={onPick} windows extraTop={70}>
          <rect x={378} y={32} width="44" height="62" rx="6" fill="#f3dca6" stroke="#7a5822" strokeWidth="3.5" />

          <path d="M400 49 v9 l6 4" fill="none" stroke="#7a5822" strokeWidth="3" strokeLinecap="round" />
          <text x="340" y="146" textAnchor="middle" fontSize="30" pointerEvents="none">📚</text>
          <RoofText x={460} y={146} t="A3" size={30} />
        </Block3>
        <GroundLabel x={400} y={238} t="A3 主楼 · 图书馆" size={24} />

        {/* 南门与指北针 */}
        <g pointerEvents="none">
          <rect x="372" y="596" width="9" height="26" rx="3" fill="#f4f4f5" stroke="#18181b" strokeWidth="2.5" />
          <rect x="419" y="596" width="9" height="26" rx="3" fill="#f4f4f5" stroke="#18181b" strokeWidth="2.5" />
          <rect x="366" y="590" width="68" height="12" rx="6" fill="#e0614f" stroke="#18181b" strokeWidth="2.5" />

          <polygon points="48,28 56,50 48,45 40,50" fill="#f87171" />
          <text x="48" y="68" textAnchor="middle" fontSize="16" fontWeight="700" fill="#d4d4d8">N</text>

      </svg>
    </div>
  );
}

/* ------------------------------ 3. 三级抽屉：楼宇 → G–6 层 → 教室/商铺标签 ------------------------------ */
function BuildingDrawer({ b, rec, patch, onClose }) {
  const [floor, setFloor] = useState(null);
  const [lvl, setLvl] = useState(1);
  const [editing, setEditing] = useState(false);
  const [openTag, setOpenTag] = useState("");
  const [nt, setNt] = useState({ name: "", kind: "room" });
  const [err, setErr] = useState("");

  useEffect(() => {
    const onKey = (e) => { if (e.key === "Escape") onClose(); };
    window.addEventListener("keydown", onKey);
    return () => window.removeEventListener("keydown", onKey);
  }, [onClose]);

  const floors = rec.floors || {};
  const tagsOf = (f) => floors[f] || [];
  const total = FLOORS.reduce((n, f) => n + tagsOf(f).length, 0);
  const hours = rec.hours !== undefined ? rec.hours : b.hours;
  const tips = rec.tips !== undefined ? rec.tips : b.tips;
  const edited = rec.hours !== undefined || rec.tips !== undefined || total > 0 || Object.keys(rec.fdesc || {}).length > 0;

  const gather = (kind) => {
    const out = [];
    FLOORS.forEach((f) => tagsOf(f).forEach((t) => { if (t.kind === kind) out.push({ f: f, name: t.name, id: t.id }); }));
    return out;
  };
  const study = gather("study");
  const printers = gather("printer");
  const micro = gather("microwave");
  const fdesc = rec.fdesc || {};
  const setFdesc = (f, v) => patch((r) => ({ ...r, fdesc: { ...(r.fdesc || {}), [f]: v } }));
  const goFloor = (f) => { setFloor(f); setLvl(3); setOpenTag(""); };
  const back = () => { if (lvl === 3) { setLvl(2); setFloor(null); setOpenTag(""); } else { setLvl(1); } };

  const addTag = () => {
    const name = nt.name.trim();
    if (!name) { setErr("请输入标签名称，例如 A2-301 或 便利店"); return; }
    setErr("");
    const tag = { id: uid(), name: name.slice(0, 40), kind: nt.kind, note: "" };
    patch((r) => ({ ...r, floors: { ...(r.floors || {}), [floor]: [...((r.floors && r.floors[floor]) || []), tag] } }));
    setNt({ ...nt, name: "" });
    setOpenTag(tag.id);
  };
  const updTag = (id, fields) => patch((r) => ({
    ...r, floors: { ...(r.floors || {}), [floor]: ((r.floors && r.floors[floor]) || []).map((t) => (t.id === id ? { ...t, ...fields } : t)) },
  }));
  const delTag = (id) => {
    patch((r) => ({ ...r, floors: { ...(r.floors || {}), [floor]: ((r.floors && r.floors[floor]) || []).filter((t) => t.id !== id) } }));
    setOpenTag("");
  };
  const resetAll = () => { patch(() => ({})); setFloor(null); setLvl(1); setOpenTag(""); };

  const cur = floor ? tagsOf(floor) : [];
  const opened = cur.find((t) => t.id === openTag) || null;

  return (
    <div className="fixed inset-0 z-50 flex items-end justify-center" role="dialog" aria-modal="true" aria-label={b.zh + " 详情"}>
      <button type="button" aria-label="关闭" onClick={onClose} className="absolute inset-0 bg-black/60" />
      <div className="sheet relative z-10 flex max-h-[86%] w-full max-w-xl flex-col overflow-hidden rounded-t-3xl border border-zinc-700 bg-zinc-900"
        style={{ paddingBottom: "env(safe-area-inset-bottom, 0px)" }}>
        <div className="mx-auto mt-2 h-1 w-10 shrink-0 rounded-full bg-zinc-600" />
        <div className="flex items-start justify-between gap-3 px-4 pb-3 pt-2">
          <div className="flex min-w-0 items-center gap-3">
            {lvl > 1 ? (
              <button type="button" onClick={back} aria-label="返回上一级"
                className="flex h-11 w-11 shrink-0 items-center justify-center rounded-2xl bg-zinc-800 text-zinc-100 active:bg-zinc-700"><I.ChevronLeft size={22} /></button>
            ) : (
              <span className="flex h-11 w-11 shrink-0 items-center justify-center rounded-2xl bg-zinc-800 text-2xl">{b.emoji}</span>
            )}
            <div className="min-w-0">
              <h2 className="truncate text-lg font-bold text-zinc-50">{b.zh}</h2>
              <p className="truncate text-xs text-zinc-400">{lvl === 3 && floor ? "楼宇 › 楼层 › " + floorLabel(floor) : lvl === 2 ? "楼宇 › 楼层概览" : b.en}</p>
            </div>
          </div>
          <div className="flex shrink-0 items-center gap-2">
            <button type="button" onClick={() => setEditing(!editing)} aria-label="切换编辑模式" aria-pressed={editing}
              className={"flex h-10 w-10 items-center justify-center rounded-lg border " + (editing ? "border-sky-400 bg-sky-400/15 text-sky-200" : "border-zinc-700 text-zinc-200")}><I.Pencil size={16} /></button>
            <button type="button" onClick={onClose} aria-label="关闭"
              className="flex h-10 w-10 items-center justify-center rounded-lg border border-zinc-700 text-zinc-200 active:bg-zinc-800"><I.X size={18} /></button>
          </div>
        </div>

        <div className="min-h-0 flex-1 overflow-y-auto px-4 pb-4">
          {editing && <p className="mb-3 rounded-lg border border-sky-400/40 bg-sky-400/10 px-3 py-2 text-xs leading-relaxed text-sky-100">编辑模式已开启：改动即时保存在本机，可在地图卡片里导出 JSON 发给朋友。</p>}

          {/* 三级：楼层标签 */}
          {lvl === 3 && floor ? (
            <div>
              <div className="-mx-1 mb-3 flex gap-1.5 overflow-x-auto px-1 pb-1">
                {FLOORS.map((f) => (
                  <button key={f} type="button" onClick={() => goFloor(f)} aria-pressed={f === floor}
                    className={"min-h-[40px] min-w-[44px] shrink-0 rounded-lg border px-3 text-sm font-semibold " +
                      (f === floor ? "border-sky-400 bg-sky-400/20 text-sky-100" : "border-zinc-700 bg-zinc-950 text-zinc-300")}>{f}</button>
                ))}
              </div>
              <h3 className="mb-1 text-sm font-semibold text-zinc-100">{floorLabel(floor)} · {cur.length} 个标签</h3>
              {fdesc[floor] && <p className="mb-2 text-xs leading-relaxed text-zinc-400">{fdesc[floor]}</p>}
              <button type="button" onClick={() => setEditing(!editing)} aria-pressed={editing}
                className={"mb-3 flex min-h-[44px] w-full items-center justify-center gap-2 rounded-xl border px-4 py-2.5 text-sm font-semibold " + (editing ? "border-sky-400 bg-sky-400/20 text-sky-100" : "border-sky-400/50 bg-sky-400/10 text-sky-200 active:bg-sky-400/20")}>
                <I.Plus size={16} /> {editing ? "完成编辑" : "+ 添加设施"}
              </button>
              {cur.length === 0 ? (
                <p className="rounded-xl border border-dashed border-zinc-700 p-4 text-sm leading-relaxed text-zinc-300">这一层还没有标签。点上方“+ 添加/编辑楼层标签”添加教室、商铺、打印机或微波炉，也可以让朋友导出 JSON 再导入。</p>
              ) : (
                <div className="flex flex-wrap gap-2">
                  {cur.map((t) => (
                    <button key={t.id} type="button" onClick={() => setOpenTag(openTag === t.id ? "" : t.id)} aria-pressed={openTag === t.id}
                      className={"min-h-[40px] rounded-lg border px-3 py-1.5 text-sm font-medium " + kindOf(t.kind).cls + (openTag === t.id ? " ring-2 ring-sky-400" : "")}>
                      {t.name}
                    </button>
                  ))}
                </div>
              )}

              {/* 三级：标签详情 */}
              {opened && (
                <div className="mt-3 rounded-xl border border-zinc-700 bg-zinc-950 p-3">
                  {editing ? (
                    <div className="flex flex-col gap-2.5">
                      <div>
                        <label htmlFor="tag-edit-name" className={labelCls}>名称</label>
                        <input id="tag-edit-name" type="text" value={opened.name} maxLength={40} onChange={(e) => updTag(opened.id, { name: e.target.value })} className={inputCls} />
                      </div>
                      <div>
                        <label htmlFor="tag-edit-kind" className={labelCls}>类型</label>
                        <select id="tag-edit-kind" value={opened.kind} onChange={(e) => updTag(opened.id, { kind: e.target.value })} className={inputCls}>
                          {KINDS.map((k) => <option key={k.key} value={k.key}>{k.label}</option>)}
                        </select>
                      </div>
                      <div>
                        <label htmlFor="tag-edit-note" className={labelCls}>备注（开放时间、位置、价格等）</label>
                        <textarea id="tag-edit-note" rows={2} maxLength={300} value={opened.note || ""} onChange={(e) => updTag(opened.id, { note: e.target.value })} className={inputCls + " text-sm"} />
                      </div>
                      <button type="button" onClick={() => delTag(opened.id)}
                        className="inline-flex min-h-[40px] items-center justify-center gap-1.5 rounded-lg border border-red-400/50 px-3 py-2 text-sm font-semibold text-red-300 active:bg-red-400/10"><I.Trash size={15} /> 删除这个标签</button>
                    </div>
                  ) : (
                    <div>
                      <div className="flex items-center justify-between gap-2">
                        <p className="min-w-0 break-words text-base font-semibold text-zinc-50">{opened.name}</p>
                        <span className={"shrink-0 rounded-md border px-2 py-0.5 text-xs font-medium " + kindOf(opened.kind).cls}>{kindOf(opened.kind).label}</span>
                      </div>
                      <p className="mt-1 text-xs text-zinc-400">{b.zh} · {floorLabel(floor)}</p>
                      <p className="mt-2 whitespace-pre-line text-sm leading-relaxed text-zinc-200">{opened.note || "暂无备注。开启编辑模式可以补充。"}</p>
                    </div>
                  )}
                </div>
              )}

              {editing && (
                <div className="mt-4 rounded-xl border border-zinc-800 bg-zinc-950 p-3">
                  <h4 className="mb-2 text-sm font-semibold text-zinc-100">在 {floorLabel(floor)} 添加标签</h4>
                  <div className="grid grid-cols-[minmax(0,1fr)_7rem] gap-2">
                    <div className="min-w-0">
                      <label htmlFor="tag-name" className={labelCls}>名称</label>
                      <input id="tag-name" type="text" maxLength={40} value={nt.name} onChange={(e) => setNt({ ...nt, name: e.target.value })}
                        onKeyDown={(e) => { if (e.key === "Enter") { e.preventDefault(); addTag(); } }} className={inputCls} placeholder="A2-301 / 便利店" />
                    </div>
                    <div className="min-w-0">
                      <label htmlFor="tag-kind" className={labelCls}>类型</label>
                      <select id="tag-kind" value={nt.kind} onChange={(e) => setNt({ ...nt, kind: e.target.value })} className={inputCls}>
                        {KINDS.map((k) => <option key={k.key} value={k.key}>{k.label}</option>)}
                      </select>
                    </div>
                  </div>
                  {err && <p className="mt-2 text-sm text-red-300" role="alert">{err}</p>}
                  <button type="button" onClick={addTag} className="mt-3 flex min-h-[44px] w-full items-center justify-center gap-2 rounded-xl bg-sky-400 px-4 py-2.5 text-sm font-semibold text-zinc-950 active:bg-sky-300"><I.Plus size={16} /> 添加标签</button>
                </div>
              )}
            </div>
          ) : lvl === 2 ? (
            /* 二级：G–6 楼层概览 */
            <div>
              <h3 className="mb-2 text-sm font-semibold text-zinc-100">楼层概览（G – 6）</h3>
              <ul className="flex flex-col gap-2">
                {FLOORS.map((f) => {
                  const n = tagsOf(f).length;
                  const kinds = {};
                  tagsOf(f).forEach((t) => { kinds[t.kind] = (kinds[t.kind] || 0) + 1; });
                  return (
                    <li key={f} className="rounded-xl border border-zinc-800 bg-zinc-950">
                      <button type="button" onClick={() => goFloor(f)} aria-label={"查看 " + floorLabel(f) + " 标签"}
                        className="flex min-h-[56px] w-full items-center gap-3 px-3 py-2 text-left active:bg-zinc-900">
                        <span className="flex h-10 w-10 shrink-0 items-center justify-center rounded-lg bg-zinc-800 text-base font-bold text-zinc-50">{f}</span>
                        <span className="min-w-0 flex-1">
                          <span className="block text-sm leading-snug text-zinc-100">{fdesc[f] || "暂无描述，等你补充"}</span>
                          <span className={"block text-[11px] " + (n ? "text-sky-300" : "text-zinc-500")}>{n ? n + " 个标签：" + Object.keys(kinds).map((k) => kindOf(k).label + kinds[k]).join(" · ") : "暂无标签"}</span>
                        </span>
                        <span className="shrink-0 text-zinc-500">›</span>
                      </button>
                      {editing && (
                        <div className="border-t border-zinc-800 px-3 py-2">
                          <label htmlFor={"fd-" + f} className={labelCls}>{floorLabel(f)} 简短描述</label>
                          <input id={"fd-" + f} type="text" maxLength={120} value={fdesc[f] || ""} onChange={(e) => setFdesc(f, e.target.value)} className={inputCls} placeholder="例如：大厅、咨询台、便利店" />
                        </div>
                      )}
                    </li>
                  );
                })}
              </ul>
            </div>
          ) : (
            /* 一级：楼宇详情 */
            <div>
              <p className={"mb-3 rounded-lg px-3 py-2 text-xs leading-relaxed " + (edited ? "border border-emerald-400/30 bg-emerald-400/5 text-emerald-200" : "border border-amber-400/30 bg-amber-400/5 text-amber-200")}>
                {edited ? "已包含你或朋友补充的信息。" : "开放时间仅供参考，以现场公告为准。点右上角铅笔，可以补充开放时间、设施和楼层标签。"}
              </p>

              <ul className="flex flex-col gap-2.5">
                <li className="rounded-xl border border-zinc-800 bg-zinc-950 p-3">
                  <p className="mb-1 flex items-center gap-1.5 text-xs font-semibold text-sky-300"><I.Clock size={14} /> 开放时间</p>
                  {editing ? <textarea id="bf-hours" aria-label="开放时间" rows={2} maxLength={200} value={hours} onChange={(e) => patch((r) => ({ ...r, hours: e.target.value }))} className={inputCls + " text-sm"} />
                    : <p className="text-sm leading-relaxed text-zinc-100">{hours || "暂无"}</p>}
                </li>
                <li className="rounded-xl border border-zinc-800 bg-zinc-950 p-3">
                  <p className="mb-1 flex items-center gap-1.5 text-xs font-semibold text-sky-300"><I.Info size={14} /> 设施贴士</p>
                  {editing ? <textarea id="bf-tips" aria-label="设施贴士" rows={2} maxLength={400} value={tips} onChange={(e) => patch((r) => ({ ...r, tips: e.target.value }))} className={inputCls + " text-sm"} />
                    : <p className="text-sm leading-relaxed text-zinc-100">{tips || "暂无"}</p>}
                </li>
                <li className="rounded-xl border border-zinc-800 bg-zinc-950 p-3">
                  <p className="mb-1 flex items-center gap-1.5 text-xs font-semibold text-violet-300"><I.Book size={14} /> 自习室分布</p>
                  <p className="text-sm leading-relaxed text-zinc-100">{study.length ? study.map((s) => floorLabel(s.f) + " " + s.name).join("、") : "还没有标注。进入楼层，添加“自习室”类型的标签。"}</p>
                </li>
                <li className="rounded-xl border border-zinc-800 bg-zinc-950 p-3">
                  <p className="mb-1 flex items-center gap-1.5 text-xs font-semibold text-amber-300">♨ 微波炉位置</p>
                  <p className="text-sm leading-relaxed text-zinc-100">{micro.length ? micro.map((s) => floorLabel(s.f) + " " + s.name).join("、") : "还没有标注。进入楼层，添加“微波炉”类型的标签。"}</p>
                </li>
                <li className="rounded-xl border border-zinc-800 bg-zinc-950 p-3">
                  <p className="mb-1 flex items-center gap-1.5 text-xs font-semibold text-emerald-300"><I.Printer size={14} /> 打印机位置</p>
                  <p className="text-sm leading-relaxed text-zinc-100">{printers.length ? printers.map((s) => floorLabel(s.f) + " " + s.name).join("、") : "还没有标注。进入楼层，添加“打印机”类型的标签。"}</p>
                </li>
              </ul>

              <button type="button" onClick={() => setLvl(2)}
                className="mt-4 flex min-h-[48px] w-full items-center justify-between rounded-xl bg-sky-400 px-4 py-2.5 text-sm font-semibold text-zinc-950 active:bg-sky-300">
                <span>查看楼层概览 G – 6（{total} 个标签）</span><span aria-hidden="true">›</span>
              </button>
            </div>
          )}

          <div className="mt-4 flex flex-wrap gap-2">
            <a href={"https://www.google.com/maps/search/?api=1&query=" + encodeURIComponent("Xiamen University Malaysia " + b.en)} target="_blank" rel="noopener noreferrer"
              className="inline-flex min-h-[40px] items-center gap-1.5 rounded-lg border border-zinc-700 px-3 py-2 text-sm text-zinc-100 active:bg-zinc-800">
              在 Google Maps 搜索 <I.Ext size={14} />
            </a>
            {edited && editing && lvl === 1 && (
              <button type="button" onClick={resetAll}
                className="inline-flex min-h-[40px] items-center rounded-lg border border-zinc-700 px-3 py-2 text-sm text-zinc-300 active:bg-zinc-800">恢复本楼默认信息</button>
            )}
          </div>
        </div>
      </div>
    </div>
  );
}

function CampusMapCard({ selected, onPick, data, onExport, onImport, exportState }) {
  const n = countTags(data);
  return (
    <Card>
      <CardTitle icon={<I.MapPin size={18} />} title="校园交互地图" tone="bg-sky-400/15 text-sky-300"
        right={<span className="tnum shrink-0 rounded-full border border-zinc-700 px-2 py-0.5 text-[11px] text-zinc-300">已标注 {n}</span>} />
      <div className="mb-3 grid grid-cols-2 gap-2">
        <button type="button" onClick={onExport}
          className="flex min-h-[50px] items-center justify-center gap-1.5 rounded-xl border border-emerald-400 bg-emerald-400 px-2 py-2.5 text-sm font-bold text-zinc-950 active:bg-emerald-300">
          {exportState === "ok" ? "✅ 已复制" : exportState === "fail" ? "⚠️ 请在弹窗里复制" : "📤 导出并复制地图 JSON"}
        </button>
        <button type="button" onClick={onImport}
          className="flex min-h-[46px] items-center justify-center gap-1.5 rounded-xl border border-sky-400/50 bg-sky-400/10 px-2 py-2.5 text-sm font-semibold text-sky-200 active:bg-sky-400/20">
          📥 导入合并 JSON
        </button>
      </div>
      <p className="mb-2 text-xs leading-relaxed text-zinc-400">按真实方位排布的 Q 版沙盘。点任意建筑：楼宇 → G–6 楼层概览 → 楼层标签；内测朋友可在手机上直接填报，再导出 JSON 发给开发者。</p>
      <CampusMap selected={selected} onPick={onPick} />
      {exportState === "ok" && (
        <div className="fixed inset-x-0 z-[70] flex justify-center px-4" style={{ bottom: "calc(20px + env(safe-area-inset-bottom, 0px))" }} role="alertdialog" aria-label="已复制">
          <div className="sheet flex w-full max-w-md items-center gap-3 rounded-2xl border border-emerald-400/60 bg-zinc-900 px-4 py-3 shadow-lg">
            <span className="text-xl" aria-hidden="true">✅</span>
            <p className="text-sm font-semibold leading-snug text-zinc-50">已复制配置！请直接微信粘贴发给开发者</p>
          </div>
        </div>
      )}
      <a href={MAPS_URL} target="_blank" rel="noopener noreferrer"
        className="mt-3 flex min-h-[44px] items-center justify-center gap-2 rounded-xl border border-zinc-700 px-3 py-2.5 text-sm font-semibold text-zinc-100 active:bg-zinc-800">
        Google Maps 看马校全景 <I.Ext size={15} />
      </a>
    </Card>
  );
}
/* ------------------------------ 7. 底部 ------------------------------ */
function BobaModal({ onClose }) {
  const [cheers, setCheers] = useLocalState("xmum_boba_cheers", 0);
  useEffect(() => {
    const onKey = (e) => { if (e.key === "Escape") onClose(); };
    window.addEventListener("keydown", onKey);
    return () => window.removeEventListener("keydown", onKey);
  }, [onClose]);
  return (
    <div className="fixed inset-0 z-50 flex items-center justify-center px-4" role="dialog" aria-modal="true" aria-label="请开发者喝奶茶">
      <button type="button" aria-label="关闭" onClick={onClose} className="absolute inset-0 bg-black/70" />
      <div className="sheet relative z-10 w-full max-w-sm rounded-2xl border border-zinc-800 bg-zinc-900 p-5">
        <div className="flex items-start justify-between gap-3">
          <div className="flex items-center gap-2.5">
            <span className="flex h-9 w-9 items-center justify-center rounded-lg bg-pink-400/15 text-pink-300"><I.Coffee size={18} /></span>
            <h2 className="text-lg font-semibold text-zinc-50">请开发者喝奶茶</h2>
          </div>
          <button type="button" onClick={onClose} aria-label="关闭"
            className="flex h-9 w-9 items-center justify-center rounded-lg border border-zinc-700 text-zinc-200 active:bg-zinc-800"><I.X size={16} /></button>
        </div>
        <p className="mt-3 text-sm leading-relaxed text-zinc-300">
          XMUM 校园助手完全免费，所有数据只保存在你的浏览器里。如果它帮你省了时间，送一杯“云奶茶”或者给项目点个 Star，就是最好的鼓励。
        </p>
        <div className="mt-4 flex items-center justify-between rounded-xl border border-zinc-800 bg-zinc-950 px-4 py-3">
          <span className="text-sm text-zinc-300">奶茶心意（本机计数）</span>
          <span className="tnum text-2xl font-semibold text-pink-300">{cheers}</span>
        </div>
        <button type="button" onClick={() => setCheers(cheers + 1)}
          className="mt-3 flex min-h-[48px] w-full items-center justify-center gap-2 rounded-xl bg-pink-400 px-4 py-3 text-base font-semibold text-zinc-950 active:bg-pink-300">
          <I.Coffee size={18} /> 送上一杯奶茶
        </button>
        <a href={GITHUB_URL} target="_blank" rel="noopener noreferrer"
          className="mt-2 flex min-h-[44px] items-center justify-center gap-2 rounded-xl border border-zinc-700 px-4 py-2.5 text-sm font-medium text-zinc-100 active:bg-zinc-800">
          <I.Github size={16} /> 去 GitHub 点 Star
        </a>
      </div>
    </div>
  );
}

function Footer({ onBoba }) {
  return (
    <footer className="mt-6 flex flex-col items-center gap-3 border-t border-zinc-800 pt-5 text-center">
      <div className="flex flex-wrap items-center justify-center gap-3">
        <a href={GITHUB_URL} target="_blank" rel="noopener noreferrer" aria-label="XMUM 校园助手 GitHub 开源地址"
          className="inline-flex overflow-hidden rounded-md border border-zinc-700 text-xs font-medium">
          <span className="flex items-center gap-1.5 bg-zinc-800 px-2.5 py-1.5 text-zinc-100"><I.Github size={14} /> GitHub</span>
          <span className="bg-emerald-500 px-2.5 py-1.5 text-zinc-950">开源</span>
        </a>
        <span className="rounded-full border border-zinc-700 bg-zinc-800 px-2 py-1 text-[11px] font-medium text-zinc-300">v1.0 MVP</span>
        <button type="button" onClick={onBoba}
          className="inline-flex min-h-[36px] items-center gap-2 rounded-md border border-pink-400/50 bg-pink-400/10 px-3 py-1.5 text-xs font-semibold text-pink-300 active:bg-pink-400/20">
          <I.Coffee size={14} /> 请开发者喝奶茶
        </button>
      </div>
      <p className="max-w-sm text-xs leading-relaxed text-zinc-400">
        开源的同学自制小工具，欢迎在 GitHub 提 Issue 与 PR。非官方项目，与厦门大学马来西亚分校无隶属关系，数据仅保存在本机浏览器。
      </p>
    </footer>
  );
}


/* ------------------------------ 应用入口 ------------------------------ */
function App() {
  const [now, setNow] = useState(() => new Date());
  const [online, setOnline] = useState(() => (typeof navigator !== "undefined" && "onLine" in navigator ? navigator.onLine : true));
  const [courses, setCourses] = useLocalState("xmum_courses_v2", SAMPLE_COURSES);
  const [customized, setCustomized] = useLocalState("xmum_courses_custom_v2", false);
  const [calStored, setCal] = useLocalState("xmum_calendar_v1", CAL_DEFAULT);
  const cal = { ...CAL_DEFAULT, ...calStored };
  const [myRoom, setMyRoom] = useLocalState("xmum_my_room", legacyRoom());
  const [attendDefault, setAttendDefault] = useLocalState("xmum_attend_default", "");
  const [mapData, setMapData] = useLocalState("xmum_map_v3", {});
  const [panel, setPanel] = useState(""); /* "", "import", "manage", "mapdata", "boba" */
  const [bldg, setBldg] = useState("");
  const [toast, setToast] = useState(null);
  const [exportState, setExportState] = useState("");

  useEffect(() => {
    const id = setInterval(() => setNow(new Date()), 1000);
    return () => clearInterval(id);
  }, []);

  useEffect(() => {
    const up = () => setOnline(true);
    const down = () => setOnline(false);
    window.addEventListener("online", up);
    window.addEventListener("offline", down);
    return () => { window.removeEventListener("online", up); window.removeEventListener("offline", down); };
  }, []);

  useEffect(() => {
    if (!toast) return undefined;
    const id = setTimeout(() => setToast(null), 9000);
    return () => clearTimeout(id);
  }, [toast]);

  const markCustom = useCallback(() => setCustomized(true), [setCustomized]);
  const close = useCallback(() => setPanel(""), []);
  const closeBldg = useCallback(() => setBldg(""), []);

  const build = (items, base) => {
    const links = {};
    courses.forEach((c) => { links[c.name] = { a: c.attendUrl || "", m: c.moodleUrl || "" }; });
    return items.map((it) => ({
      id: uid(), day: it.day, start: it.start, end: it.end, name: it.name, room: it.room || "",
      weeks: it.weeks || "", teacher: it.teacher || "", attendUrl: (links[it.name] || {}).a || "", moodleUrl: (links[it.name] || {}).m || "",
    }));
  };

  /* 粘贴文本导入：可追加或替换 */
  const applyImport = (items, mode) => {
    const made = build(items);
    if (mode === "replace") {
      setCourses(made);
    } else {
      const have = {};
      courses.forEach((c) => { have[c.name + "|" + c.day + "|" + c.start + "|" + c.end] = true; });
      setCourses([...courses, ...made.filter((c) => !have[c.name + "|" + c.day + "|" + c.start + "|" + c.end])]);
    }
    setCustomized(true);
    setPanel("manage");
  };

  /* HTML 文件导入：识别成功后自动保存并替换，可撤销 */
  const applyFile = (items, fileName, skipped) => {
    const backup = courses;
    const backupCustom = customized;
    setCourses(build(items));
    setCustomized(true);
    setPanel("");
    setToast({ msg: "已从 " + fileName + " 导入 " + items.length + " 个时段" + (skipped ? "（另有 " + skipped + " 处提示，详见控制台）" : ""), backup: backup, backupCustom: backupCustom });
  };

  const undo = () => {
    if (!toast) return;
    setCourses(toast.backup);
    setCustomized(toast.backupCustom);
    setToast(null);
  };

  const exportNow = async () => {
    const ok = await copyText(exportMapJson(mapData));
    if (ok) {
      setExportState("ok");
      setTimeout(() => setExportState(""), 4500);
    } else {
      setExportState("fail");
      setPanel("mapdata");
    }
  };

  const selected = BUILDINGS.find((b) => b.id === bldg) || null;

  return (
    <div className="mx-auto w-full max-w-xl text-zinc-100">
      <Header now={now} online={online} />
      <DormBar room={myRoom || ""} setRoom={setMyRoom} />
      <ServiceHall myRoom={myRoom || ""} />
      <main className="flex flex-col gap-3">
        <CourseCard attendDefault={attendDefault} now={now} cal={cal} onCal={() => setPanel("calendar")} onFull={() => setPanel("fulltt")} courses={courses} customized={customized} onImport={() => setPanel("import")} onManage={() => setPanel("manage")} />
        <CampusMapCard selected={bldg} onPick={setBldg} data={mapData} onExport={exportNow} onImport={() => setPanel("mapdata")} exportState={exportState} />
        <ElectricityCard myRoom={myRoom || ""} onEditRoom={() => { const el = document.getElementById("my-room-input"); if (el) { el.scrollIntoView({ block: "center", behavior: "smooth" }); el.focus(); } }} />
        <TransitCard now={now} />
      </main>
      <Footer onBoba={() => setPanel("boba")} />

      {panel === "import" && <ImportModal customized={customized} onApply={applyImport} onFileApply={applyFile} onManual={() => setPanel("manage")} onClose={close} />}
      {panel === "manage" && <ManageDrawer attendDefault={attendDefault} setAttendDefault={setAttendDefault} courses={courses} setCourses={setCourses} markCustom={markCustom} onClose={close} />}
      {panel === "fulltt" && <FullTimetable now={now} cal={cal} courses={courses} onClose={close} onImport={() => setPanel("import")} />}
      {panel === "calendar" && <CalendarModal cal={cal} setCal={setCal} now={now} onClose={close} />}
      {panel === "boba" && <BobaModal onClose={close} />}
      {panel === "mapdata" && <MapDataModal data={mapData} setData={setMapData} onClose={close} />}
      {selected && (
        <BuildingDrawer key={selected.id} b={selected} rec={mapData[selected.id] || {}}
          patch={(fn) => setMapData((prev) => {
            const nextRec = fn(prev[selected.id] || {});
            const next = { ...prev };
            if (nextRec && Object.keys(nextRec).length) next[selected.id] = nextRec; else delete next[selected.id];
            return next;
          })}
          onClose={closeBldg} />
      )}

      {toast && (
        <div className="fixed inset-x-0 z-[60] flex justify-center px-4" style={{ bottom: "calc(16px + env(safe-area-inset-bottom, 0px))" }} role="status">
          <div className="sheet flex w-full max-w-md items-center justify-between gap-3 rounded-2xl border border-emerald-400/50 bg-zinc-900 px-4 py-3 shadow-lg">
            <span className="flex min-w-0 items-center gap-2 text-sm text-zinc-50"><I.Check size={18} className="shrink-0 text-emerald-300" /><span className="break-words">{toast.msg}</span></span>
            <button type="button" onClick={undo}
              className="inline-flex min-h-[36px] shrink-0 items-center gap-1.5 rounded-lg border border-zinc-600 px-3 py-1.5 text-sm font-semibold text-zinc-100 active:bg-zinc-800"><I.Undo size={14} /> 撤销</button>
          </div>
        </div>
      )}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>

</body>
