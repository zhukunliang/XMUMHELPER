<style>
  /* 布局：单列移动优先。顶部三段式状态栏 → 下拉服务大厅 → 课程与签到 → 电费 → 交通 → 紧急热线 → 页脚。固定深色 zinc 主题。 */
  :root {
    color-scheme: dark;
    --bg: #09090b;
    --fg: #f4f4f5;
    --muted: #a1a1aa;
    --card: #18181b;
    --line: #27272a;
    --accent: #38bdf8;
  }
  html, body { background: var(--bg); color: var(--fg); }
  body {
    padding-inline: 16px; padding-block: 16px 28px;
    -webkit-text-size-adjust: 100%;
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans SC", "Segoe UI", sans-serif;
    font-size: 15px;
  }
  .tnum { font-variant-numeric: tabular-nums; }
  input, select, button, textarea { font-family: inherit; }
  input:focus-visible, select:focus-visible, button:focus-visible, a:focus-visible, textarea:focus-visible {
    outline: 2px solid var(--accent); outline-offset: 2px;
  }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
  @keyframes slideUp { from { transform: translateY(24px); opacity: 0; } to { transform: none; opacity: 1; } }
  @keyframes dropDown { from { transform: translateY(-10px); opacity: 0; } to { transform: none; opacity: 1; } }
  .sheet { animation: slideUp .18s ease-out; }
  .hall { animation: dropDown .2s ease-out; }
  .bld { cursor: pointer; outline: none; -webkit-tap-highlight-color: transparent; }
  .bld:active { opacity: .8; }
  .bld:focus-visible .hit { stroke: #38bdf8; stroke-width: 2; }
  .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0,0,0,0); white-space: nowrap; border: 0; }
</style>

const { useState, useEffect, useRef, useMemo, useCallback } = React;


/* ------------------------------ 常量 ------------------------------ */

const DEFAULT_ELECTRICITY_URL = "https://www.xmu.edu.my";

/* 环境数据为示例值：网页沙箱无法联网获取实时天气 */

function every(startH, startM, endH, endM, step) {
  const out = [];
  for (let t = startH * 60 + startM; t <= endH * 60 + endM; t += step) {
    out.push(String(Math.floor(t / 60)).padStart(2, "0") + ":" + String(t % 60).padStart(2, "0"));
  }
  return out;
}

/* 内置示例时间表，请以校方与 ERL 最新公告为准 */
const SHUTTLE_WEEKDAY = ["07:30", "08:00", "08:30", "09:00", "10:00", "12:00", "13:00", "15:00", "17:00", "18:00", "19:30", "21:00", "22:00"];
const SHUTTLE_WEEKEND = ["09:00", "11:00", "14:00", "17:00", "20:00", "22:00"];
const ERL_WEEKDAY = every(5, 30, 23, 30, 30);
const ERL_WEEKEND = every(6, 0, 23, 30, 45);
const shuttleFor = (dow) => (dow === 0 || dow === 6 ? SHUTTLE_WEEKEND : SHUTTLE_WEEKDAY);
const erlFor = (dow) => (dow === 0 || dow === 6 ? ERL_WEEKEND : ERL_WEEKDAY);

/* ------------------------------ 工具函数 ------------------------------ */
const pad = (n) => String(n).padStart(2, "0");
const toMin = (hhmm) => { const p = hhmm.split(":"); return parseInt(p[0], 10) * 60 + parseInt(p[1], 10); };
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 6);

function fmtDur(mins) {
  mins = Math.max(0, Math.round(mins));
  const d = Math.floor(mins / 1440);
  const h = Math.floor((mins % 1440) / 60);
  const m = mins % 60;
  if (d > 0) return d + "天" + h + "小时";
  if (h > 0) return h + "小时" + (m ? m + "分钟" : "");
  return m < 1 ? "不到1分钟" : m + "分钟";
}

function normalizeUrl(raw) {
  const s = (raw || "").trim();
  if (!s) return "";
  if (/^https?:\/\//i.test(s)) return s;
  if (/^[a-z][a-z0-9+.-]*:/i.test(s)) return "";
  return "https://" + s;
}

function telHref(raw) {
  const s = (raw || "").trim();
  const digits = s.replace(/\D/g, "");
  if (digits.length < 7 || /[xX]/.test(s)) return "";
  return "tel:" + (s.charAt(0) === "+" ? "+" : "") + digits;
}

function useLocalState(key, initial) {
  const [value, setValue] = useState(() => {
    try {
      const raw = window.localStorage.getItem(key);
      return raw !== null ? JSON.parse(raw) : initial;
    } catch (e) { return initial; }
  });
  useEffect(() => {
    try { window.localStorage.setItem(key, JSON.stringify(value)); } catch (e) {}
  }, [key, value]);
  return [value, setValue];
}

async function copyText(text) {
  try {
    if (navigator.clipboard && navigator.clipboard.writeText) {
      await navigator.clipboard.writeText(text);
      return true;
    }
  } catch (e) {}
  try {
    const ta = document.createElement("textarea");
    ta.value = text;
    ta.setAttribute("readonly", "");
    ta.style.position = "fixed";
    ta.style.opacity = "0";
    ta.style.top = "0";
    document.body.appendChild(ta);
    ta.focus();
    ta.select();
    ta.setSelectionRange(0, text.length);
    const ok = document.execCommand("copy");
    document.body.removeChild(ta);
    return ok;
  } catch (e) { return false; }
}

/* 复制反馈：返回 [已复制的 key, 触发复制函数] */
function useCopy() {
  const [copiedKey, setCopiedKey] = useState("");
  const timer = useRef(null);
  useEffect(() => () => { if (timer.current) clearTimeout(timer.current); }, []);
  const copy = async (key, text) => {
    const ok = await copyText(text);
    if (ok) {
      setCopiedKey(key);
      if (timer.current) clearTimeout(timer.current);
      timer.current = setTimeout(() => setCopiedKey(""), 1800);
    }
    return ok;
  };
  return [copiedKey, copy];
}

function upcoming(getSched, now, count) {
  const out = [];
  for (let off = 0; off < 3 && out.length < count; off++) {
    const d = new Date(now.getFullYear(), now.getMonth(), now.getDate() + off);
    const sched = getSched(d.getDay());
    for (let i = 0; i < sched.length; i++) {
      const p = sched[i].split(":");
      const dep = new Date(d.getFullYear(), d.getMonth(), d.getDate(), parseInt(p[0], 10), parseInt(p[1], 10), 0);
      if (dep > now) out.push({ t: sched[i], secs: Math.floor((dep - now) / 1000), off: off });
      if (out.length >= count) break;
    }
  }
  return out;
}

function aqiLevel(v) {
  if (v <= 50) return { label: "优", dot: "bg-emerald-400", text: "text-emerald-300" };
  if (v <= 100) return { label: "良", dot: "bg-yellow-400", text: "text-yellow-300" };
  if (v <= 150) return { label: "轻度污染", dot: "bg-orange-400", text: "text-orange-300" };
  return { label: "中度以上", dot: "bg-red-400", text: "text-red-300" };
}


/* ------------------------------ 校历：202609 学期（周次计算 + 周次过滤 + 本地微调） ------------------------------ */
/* 依据马校本科校历：September Semester 25 Sep 2026 – 21 Jan 2027；Week 1 从 28 Sep（周一）开始，共 14 个教学周，
   4–10 Jan 复习周，11–21 Jan 考试周。该学期校历上没有期中假期，所以默认不设放假周，可在“校历设置”里手动添加。 */
const CAL_DEFAULT = { semester: "202609", start: "2026-09-28", recessFrom: "", recessTo: "", teachEnd: "2027-01-03" };
const CAL_HOLIDAYS = {
  "2026-11-08": "Deepavali", "2026-11-09": "Deepavali", "2026-12-11": "雪兰莪苏丹华诞",
  "2026-12-25": "圣诞节", "2027-01-01": "元旦",
};

function parseYmd(s) {
  const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(s || "");
  if (!m) return null;
  const d = new Date(parseInt(m[1], 10), parseInt(m[2], 10) - 1, parseInt(m[3], 10));
  return isNaN(d.getTime()) ? null : d;
}
function ymdOf(d) {
  return d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate());
}
function daysBetween(a, b) {
  const da = new Date(a.getFullYear(), a.getMonth(), a.getDate());
  const db = new Date(b.getFullYear(), b.getMonth(), b.getDate());
  return Math.round((db.getTime() - da.getTime()) / 86400000);
}

/* 返回 { phase: unset | before | teaching | recess | after, week, holiday, days } */
function academicInfo(cal, date) {
  const start = parseYmd(cal.start);
  if (!start) return { phase: "unset" };
  const diff = daysBetween(start, date);
  if (diff < 0) return { phase: "before", days: -diff };
  const end = parseYmd(cal.teachEnd);
  if (end && daysBetween(end, date) > 0) return { phase: "after" };
  const rf = parseYmd(cal.recessFrom);
  const rt = parseYmd(cal.recessTo);
  const hasRecess = !!(rf && rt && daysBetween(rf, rt) >= 0);
  if (hasRecess && daysBetween(rf, date) >= 0 && daysBetween(date, rt) >= 0) return { phase: "recess" };
  let week = Math.floor(diff / 7) + 1;
  if (hasRecess && daysBetween(rt, date) > 0) week -= Math.ceil((daysBetween(rf, rt) + 1) / 7);
  return { phase: "teaching", week: week, holiday: CAL_HOLIDAYS[ymdOf(date)] || "" };
}

/* "1-7" / "1-7, 9-14" / "Weeks 1-14" → 该周是否上课；没写周次视为每周都有 */
function weeksInclude(weeks, wk) {
  const s = String(weeks || "");
  if (!/\d/.test(s)) return true;
  const re = /(\d+)\s*(?:[-–—~]|to)\s*(\d+)|(\d+)/gi;
  let m;
  while ((m = re.exec(s)) !== null) {
    if (m[3]) { if (parseInt(m[3], 10) === wk) return true; }
    else if (wk >= parseInt(m[1], 10) && wk <= parseInt(m[2], 10)) return true;
  }
  return false;
}

function courseOn(c, date, cal) {
  const info = academicInfo(cal, date);
  if (info.phase === "unset") return true;
  if (info.phase !== "teaching") return false;
  if (info.holiday) return false;
  return weeksInclude(c.weeks, info.week);
}

function getCourseStatus(courses, now, cal) {
  const nowMin = now.getHours() * 60 + now.getMinutes() + now.getSeconds() / 60;
  for (let off = 0; off < 16; off++) {
    const date = new Date(now.getFullYear(), now.getMonth(), now.getDate() + off);
    const list = courses
      .filter((c) => c.day === date.getDay() && (!cal || courseOn(c, date, cal)))
      .sort((a, b) => toMin(a.start) - toMin(b.start));
    if (off === 0) {
      const cur = list.find((c) => toMin(c.start) <= nowMin && nowMin < toMin(c.end));
      if (cur) return { kind: "now", course: cur, off: 0, mins: toMin(cur.end) - nowMin };
      const nxt = list.find((c) => toMin(c.start) > nowMin);
      if (nxt) return { kind: "next", course: nxt, off: 0, mins: toMin(nxt.start) - nowMin };
    } else if (list.length) {
      const c = list[0];
      return { kind: "next", course: c, off: off, mins: off * 1440 + toMin(c.start) - nowMin };
    }
  }
  return null;
}

function CalendarModal({ cal, setCal, now, onClose }) {
  useEffect(() => {
    const onKey = (e) => { if (e.key === "Escape") onClose(); };
    window.addEventListener("keydown", onKey);
    return () => window.removeEventListener("keydown", onKey);
  }, [onClose]);
  const set = (k, v) => setCal({ ...cal, [k]: v });
  const st = parseYmd(cal.start);
  const info = academicInfo(cal, now);
  const notMonday = st && st.getDay() !== 1;
  const preview = info.phase === "teaching" ? "按当前设置，今天是第 " + info.week + " 教学周"
    : info.phase === "recess" ? "按当前设置，今天处在放假周"
    : info.phase === "before" ? "按当前设置，学期还没开始（" + info.days + " 天后）"
    : info.phase === "after" ? "按当前设置，教学周已结束" : "还没有设置开学首日";
  return (
    <div className="fixed inset-0 z-50 flex items-end justify-center sm:items-center" role="dialog" aria-modal="true" aria-label="校历设置">
      <button type="button" aria-label="关闭" onClick={onClose} className="absolute inset-0 bg-black/70" />
      <div className="sheet relative z-10 flex max-h-[92%] w-full max-w-xl flex-col overflow-hidden rounded-t-2xl border border-zinc-800 bg-zinc-900 sm:rounded-2xl"
        style={{ paddingBottom: "env(safe-area-inset-bottom, 0px)" }}>
        <div className="flex items-center justify-between gap-3 border-b border-zinc-800 px-4 py-3">
          <h2 className="text-base font-semibold text-zinc-50">⚙️ 校历设置</h2>
          <button type="button" onClick={onClose} aria-label="关闭"
            className="flex h-10 w-10 items-center justify-center rounded-lg border border-zinc-700 text-zinc-200 active:bg-zinc-800"><I.X size={18} /></button>
        </div>
        <div className="min-h-0 flex-1 overflow-y-auto px-4 py-4">
          <p className="rounded-lg border border-sky-400/30 bg-sky-400/5 px-3 py-2 text-xs leading-relaxed text-sky-100">
            默认是 202609 学期：Week 1 从 2026-09-28（周一）开始，教学周共 14 周，4–10 Jan 复习周、11–21 Jan 考试周。校历如有调整，或新学期开始时，在这里改开学首日即可，只保存在本机。
          </p>
          <div className="mt-3 flex flex-col gap-3">
            <div>
              <label htmlFor="cal-sem" className={labelCls}>学期代号</label>
              <input id="cal-sem" type="text" value={cal.semester} maxLength={12} onChange={(e) => set("semester", e.target.value)} className={inputCls} placeholder="例如 202609" />
            </div>
            <div>
              <label htmlFor="cal-start" className={labelCls}>开学首日（Week 1 的周一）</label>
              <input id="cal-start" type="date" value={cal.start} onChange={(e) => set("start", e.target.value)} className={inputCls} />
              {notMonday && <p className="mt-1 text-xs text-amber-300" role="alert">这一天不是周一，周次会从这一天起每 7 天算一周，建议改成周一。</p>}
            </div>
            <div className="grid grid-cols-2 gap-3">
              <div>
                <label htmlFor="cal-rf" className={labelCls}>放假开始（可不填）</label>
                <input id="cal-rf" type="date" value={cal.recessFrom} onChange={(e) => set("recessFrom", e.target.value)} className={inputCls} />
              </div>
              <div>
                <label htmlFor="cal-rt" className={labelCls}>放假结束</label>
                <input id="cal-rt" type="date" value={cal.recessTo} onChange={(e) => set("recessTo", e.target.value)} className={inputCls} />
              </div>
            </div>
            <p className="-mt-1 text-xs text-zinc-400">放假周内常规课程暂停，放假周不计入教学周次。该学期校历没有期中假期，所以默认留空。</p>
            <div>
              <label htmlFor="cal-end" className={labelCls}>教学周最后一天（之后进入复习/考试周）</label>
              <input id="cal-end" type="date" value={cal.teachEnd} onChange={(e) => set("teachEnd", e.target.value)} className={inputCls} />
            </div>
          </div>
          <p className="mt-3 text-sm font-semibold text-zinc-100" aria-live="polite">{preview}</p>
          <div className="mt-4 grid grid-cols-2 gap-2.5">
            <button type="button" onClick={() => setCal({ ...CAL_DEFAULT })}
              className="min-h-[44px] rounded-xl border border-zinc-700 px-3 py-2 text-sm text-zinc-200 active:bg-zinc-800">恢复 202609 默认</button>
            <button type="button" onClick={onClose}
              className="min-h-[44px] rounded-xl bg-sky-400 px-3 py-2 text-sm font-semibold text-zinc-950 active:bg-sky-300">完成</button>
          </div>
        </div>
      </div>
    </div>
  );
}
/* ------------------------------ 课表文本解析（纯前端正则） ------------------------------ */
const DAY_SRC = "(?:周|星期|礼拜)([一二三四五六日天])|\\b(mon(?:day)?|tues?(?:day)?|wed(?:nesday)?|thu(?:rs?(?:day)?)?|fri(?:day)?|sat(?:urday)?|sun(?:day)?)\\b";
const TIME_SRC = "(\\d{1,2}):(\\d{2})\\s*([ap]\\.?m\\.?)?\\s*(?:[-–—~～至到]|to)\\s*(\\d{1,2}):(\\d{2})\\s*([ap]\\.?m\\.?)?";
const CN_DAY = { "一": 1, "二": 2, "三": 3, "四": 4, "五": 5, "六": 6, "日": 0, "天": 0 };
const EN_DAY = { mon: 1, tue: 2, wed: 3, thu: 4, fri: 5, sat: 6, sun: 0 };

function to24(h, m, ap) {
  h = parseInt(h, 10); m = parseInt(m, 10);
  if (ap) {
    const pm = ap.toLowerCase().charAt(0) === "p";
    h = (h % 12) + (pm ? 12 : 0);
  }
  if (h > 23 || m > 59) return null;
  return pad(h) + ":" + pad(m);
}

function cleanName(s) {
  let t = s
    .replace(/[\(\[（【][^\)\]）】]*[\)\]）】]/g, " ")
    .replace(/^\s*\d+[.)、]\s*/, "")
    .replace(/[|,;，；、\/\t]+/g, " ")
    .replace(/\s+/g, " ")
    .replace(/^[\s\-–:：.]+|[\s\-–:：.]+$/g, "");
  if (t.length < 2 || /^[\d\s:.\-]+$/.test(t)) return "";
  return t.slice(0, 40);
}

/* 清洗：去 HTML 标签、实体、缴费状态栏、学期编号，保留换行 */
const STATUS_RE = /(已缴费|未缴费|待缴费|缴费状态|已付款|未付款|\bun-?paid\b|\bpaid\b|payment\s*status|fee\s*status|\bpending\b|\bsettled\b)/gi;
const CODE_RE = /\b[A-Za-z]{2,4}\s?\d{3,4}[A-Za-z]?\b/;
function prepText(raw) {
  let t = String(raw == null ? "" : raw);
  t = t.replace(/<(script|style)[\s\S]*?<\/\1>/gi, " ");
  t = t.replace(/<\s*(br|\/tr|\/p|\/div|\/li|\/h\d|\/table)\b[^>]*>/gi, "\n");
  t = t.replace(/<[^>]*>/g, " ");
  t = t.replace(/&nbsp;|&#160;/gi, " ").replace(/&amp;/gi, "&").replace(/&lt;/gi, "<").replace(/&gt;/gi, ">").replace(/&#?\w+;/g, " ");
  t = t.replace(/[ 　]/g, " ");
  t = t.replace(STATUS_RE, " ");
  t = t.replace(/(?:Semester|学期)\s*[:：]?\s*\d{4,6}/gi, " ").replace(/\b20\d{2}(?:0[1-9]|1[0-2])\b/g, " ");
  return t;
}

function parseTimetable(text) {
  const out = [];
  const skipped = [];
  try {
    const lines = prepText(text).split(/\r?\n/).map((l, i) => ({ n: i + 1, t: l.trim() })).filter((x) => x.t);
    const seen = {};
    let lastName = "";
    let lastDay = null;

    lines.forEach(({ n, t: raw }) => {
      try {
        /* 0830-1030 / 0830 - 1020 这类四位数写法（分钟限定 00/05…55，避免误伤年份） */
        const line = raw.replace(/(^|\D)(\d{2})(\d{2})\s*([-–—~～至到]|to)\s*(\d{2})(\d{2})(?!\d)/gi, (m0, pre, h1, m1, sep, h2, m2) => {
          if (+h1 > 23 || +h2 > 23 || +m1 > 59 || +m2 > 59 || +m1 % 5 || +m2 % 5) return m0;
          return pre + h1 + ":" + m1 + " - " + h2 + ":" + m2;
        });

        const times = [];
        const tre = new RegExp(TIME_SRC, "gi");
        let tm;
        while ((tm = tre.exec(line)) !== null) {
          let sAp = tm[3], eAp = tm[6];
          if (!sAp && eAp) {
            sAp = eAp;
            const sh = parseInt(tm[1], 10) % 12, eh = parseInt(tm[4], 10) % 12;
            if (sh > eh) sAp = eAp.toLowerCase().charAt(0) === "p" ? "am" : "pm";
          }
          times.push({ idx: tm.index, end: tm.index + tm[0].length, start: to24(tm[1], tm[2], sAp), endT: to24(tm[4], tm[5], eAp) });
          if (tm[0].length === 0) tre.lastIndex++;
        }

        const days = [];
        const dre = new RegExp(DAY_SRC, "gi");
        let dm;
        while ((dm = dre.exec(line)) !== null) {
          const d = dm[1] ? CN_DAY[dm[1]] : EN_DAY[dm[2].toLowerCase().slice(0, 3)];
          days.push({ idx: dm.index, end: dm.index + dm[0].length, day: d, used: false });
          if (dm[0].length === 0) dre.lastIndex++;
        }

        /* 去掉时间与星期后剩下的就是课程名（含课程代码） */
        let rest = line;
        times.slice().reverse().forEach((x) => { rest = rest.slice(0, x.idx) + " " + rest.slice(x.end); });
        days.forEach(() => { rest = rest.replace(new RegExp(DAY_SRC, "i"), " "); });
        let nameHere = cleanName(rest);
        const cm = rest.match(CODE_RE);
        if (!nameHere && cm) nameHere = cm[0].replace(/\s+/g, "").toUpperCase();

        if (times.length === 0) {
          if (days.length) lastDay = days.map((d) => d.day);
          if (nameHere && (cm || !days.length)) lastName = nameHere;
          return;
        }

        const name = nameHere || lastName;
        if (!name) { skipped.push({ n: n, text: raw.slice(0, 40), reason: "没认出课程名" }); return; }
        if (days.length === 0 && lastDay) { days.push(...lastDay.map((d) => ({ idx: 0, end: 0, day: d, used: false }))); lastDay = null; }
        if (days.length === 0) { skipped.push({ n: n, text: raw.slice(0, 40), reason: "没认出星期" }); return; }
        let prevEnd = 0;
        let added = false;
        times.forEach((t, k) => {
          const nextIdx = k + 1 < times.length ? times[k + 1].idx : line.length;
          let pick = days.filter((d) => !d.used && d.idx >= prevEnd && d.idx < t.idx);
          if (pick.length === 0) pick = days.filter((d) => !d.used && d.idx >= t.end && d.idx < nextIdx);
          if (pick.length === 0) pick = days.filter((d) => !d.used);
          if (pick.length === 0) pick = days;
          pick.forEach((d) => { d.used = true; });
          prevEnd = t.end;
          if (!t.start || !t.endT || toMin(t.endT) - toMin(t.start) < 20) return;
          pick.forEach((d) => {
            const key = name + "|" + d.day + "|" + t.start + "|" + t.endT;
            if (seen[key]) { added = true; return; }
            seen[key] = true;
            added = true;
            out.push({ name: name, day: d.day, start: t.start, end: t.endT });
          });
        });
        if (!added) skipped.push({ n: n, text: raw.slice(0, 40), reason: "时间不合法" });
        if (nameHere) lastName = nameHere;
      } catch (e) {
        console.log("[XMUM 课表] 第 " + n + " 行解析异常", e);
        skipped.push({ n: n, text: raw.slice(0, 40), reason: "解析异常" });
      }
    });
  } catch (e) {
    console.log("[XMUM 课表] 解析失败", e);
    skipped.push({ n: 0, text: "", reason: "整体解析异常" });
  }
  out.skipped = skipped;
  return out;
}

/* ------------------------------ 教务课表 HTML 解析（原生 FileReader + DOMParser） ------------------------------ */
function timeFromMatch(tm) {
  let sAp = tm[3], eAp = tm[6];
  if (!sAp && eAp) {
    sAp = eAp;
    const sh = parseInt(tm[1], 10) % 12, eh = parseInt(tm[4], 10) % 12;
    if (sh > eh) sAp = eAp.toLowerCase().charAt(0) === "p" ? "am" : "pm";
  }
  const s = to24(tm[1], tm[2], sAp);
  const e = to24(tm[4], tm[5], eAp);
  if (!s || !e || toMin(e) <= toMin(s)) return null;
  return { start: s, end: e };
}

function cellText(el) {
  const doc = el.ownerDocument;
  const c = el.cloneNode(true);
  const brs = c.querySelectorAll("br");
  for (let i = 0; i < brs.length; i++) brs[i].parentNode.replaceChild(doc.createTextNode("\n"), brs[i]);
  const blocks = c.querySelectorAll("div,p,li");
  for (let i = 0; i < blocks.length; i++) blocks[i].appendChild(doc.createTextNode("\n"));
  return (c.textContent || "").replace(/ /g, " ").replace(/[ \t\r]+/g, " ").replace(/ *\n[\s]*/g, "\n").trim();
}

function tableMatrix(table) {
  const m = [];
  const rows = table.rows;
  for (let r = 0; r < rows.length; r++) {
    if (!m[r]) m[r] = [];
    let c = 0;
    const cells = rows[r].cells;
    for (let k = 0; k < cells.length; k++) {
      while (m[r][c]) c++;
      const el = cells[k];
      const rs = Math.min(30, Math.max(1, el.rowSpan || 1));
      const cs = Math.min(30, Math.max(1, el.colSpan || 1));
      const cell = { text: cellText(el), r0: r, c0: c, rs: rs };
      for (let dr = 0; dr < rs && r + dr < rows.length; dr++) {
        if (!m[r + dr]) m[r + dr] = [];
        for (let dc = 0; dc < cs; dc++) m[r + dr][c + dc] = cell;
      }
      c += cs;
    }
  }
  return m;
}

function dayFromLabel(text) {
  const first = (text || "").split("\n")[0].trim();
  if (!first || first.length > 14) return -1;
  const mm = /^(?:(?:周|星期|礼拜)([一二三四五六日天])|(mon|tue|wed|thu|fri|sat|sun)[a-z]*)/i.exec(first);
  if (!mm) return -1;
  return mm[1] ? CN_DAY[mm[1]] : EN_DAY[mm[2].toLowerCase()];
}

function isRoomToken(t) {
  return /^[A-Za-z]{1,3}\d{0,2}-\d{2,4}[A-Za-z]?$/.test(t) || /^(?:LT|Lab|LAB)\d+$/.test(t);
}

/* 从一行文字里拆出课程名与教室 */
function splitNameRoom(line) {
  let room = "";
  const lab = /(?:教室|地点|Room|Venue|Location)\s*[:：]?\s*([^\s,;，；]+)/i.exec(line);
  let rest = line;
  if (lab) { room = lab[1]; rest = line.replace(lab[0], " "); }
  else {
    const lt = /\b(?:Lab|LT)\s?\d+\b/i.exec(line);
    if (lt) { room = lt[0]; rest = line.replace(lt[0], " "); }
  }
  const toks = rest.split(/\s+/).filter(Boolean);
  const kept = [];
  toks.forEach((t) => {
    if (!room && isRoomToken(t)) room = t;
    else if (t !== room) kept.push(t);
  });
  return { name: cleanName(kept.join(" ")), room: room };
}

function gridSlots(m) {
  let hdr = -1;
  let dayCols = {};
  for (let r = 0; r < Math.min(m.length, 6); r++) {
    const row = m[r] || [];
    const found = {};
    let n = 0;
    for (let c = 0; c < row.length; c++) {
      if (!row[c]) continue;
      const d = dayFromLabel(row[c].text);
      if (d >= 0) { found[c] = d; n++; }
    }
    if (n >= 3) { hdr = r; dayCols = found; break; }
  }
  if (hdr < 0) return null;

  const cols = Object.keys(dayCols).map(Number);
  const firstDayCol = Math.min.apply(null, cols);
  const rowTime = (row) => {
    for (let c = 0; c < firstDayCol; c++) {
      if (!row || !row[c]) continue;
      const tm = new RegExp(TIME_SRC, "i").exec(row[c].text);
      if (tm) { const t = timeFromMatch(tm); if (t) return t; }
    }
    return null;
  };

  const out = [];
  const done = [];
  for (let r = hdr + 1; r < m.length; r++) {
    const row = m[r] || [];
    cols.forEach((c) => {
      const cell = row[c];
      if (!cell || !cell.text || done.indexOf(cell) >= 0) return;
      done.push(cell);
      let t = null;
      const own = new RegExp(TIME_SRC, "i").exec(cell.text);
      if (own) t = timeFromMatch(own);
      if (!t) {
        const t0 = rowTime(m[cell.r0]);
        const t1 = rowTime(m[Math.min(cell.r0 + cell.rs - 1, m.length - 1)]);
        if (t0 && t1 && toMin(t1.end) > toMin(t0.start)) t = { start: t0.start, end: t1.end };
      }
      if (!t) return;
      const lines = cell.text.split("\n").map((l) => l.replace(new RegExp(TIME_SRC, "gi"), " ").trim()).filter(Boolean);
      let name = "", room = "";
      lines.forEach((ln) => {
        const sp = splitNameRoom(ln);
        if (!room && sp.room) room = sp.room;
        if (!name && sp.name) name = sp.name;
      });
      if (!name) return;
      out.push({ name: name, day: dayCols[c], start: t.start, end: t.end, room: room });
    });
  }
  return out;
}

function listSlots(m) {
  const KW = {
    name: /课程|科目|course|subject|module/i,
    day: /星期|周几|day/i,
    time: /时间|节次|time|period|schedule/i,
    room: /教室|地点|room|venue|location/i,
  };
  let hdr = -1;
  let idx = {};
  for (let r = 0; r < Math.min(m.length, 5); r++) {
    const row = m[r] || [];
    const found = {};
    let n = 0;
    for (let c = 0; c < row.length; c++) {
      if (!row[c] || row[c].text.length > 20) continue;
      ["name", "day", "time", "room"].forEach((k) => {
        if (found[k] === undefined && KW[k].test(row[c].text)) { found[k] = c; n++; }
      });
    }
    if (found.name !== undefined && n >= 2) { hdr = r; idx = found; break; }
  }
  if (hdr < 0) return null;

  const out = [];
  for (let r = hdr + 1; r < m.length; r++) {
    const row = m[r] || [];
    const get = (k) => (idx[k] !== undefined && row[idx[k]] ? row[idx[k]].text.replace(/\n/g, " ") : "");
    const nm = cleanName(get("name"));
    if (!nm) continue;
    const slots = parseTimetable("课程 " + get("day") + " " + get("time"));
    const room = get("room").split(/\s+/)[0] || "";
    slots.forEach((s) => out.push({ name: nm, day: s.day, start: s.start, end: s.end, room: room }));
  }
  return out;
}

function rowFallback(m) {
  const out = [];
  m.forEach((row) => {
    if (!row) return;
    const seen = [];
    const parts = [];
    row.forEach((cell) => {
      if (cell && seen.indexOf(cell) < 0) { seen.push(cell); parts.push(cell.text.replace(/\n/g, " ")); }
    });
    parseTimetable(parts.join("  ")).forEach((s) => {
      const sp = splitNameRoom(s.name);
      out.push({ name: sp.name || s.name, day: s.day, start: s.start, end: s.end, room: sp.room });
    });
  });
  return out;
}

function bodyText(doc) {
  const body = doc.body;
  if (!body) return "";
  const brs = body.querySelectorAll("br");
  for (let i = 0; i < brs.length; i++) brs[i].parentNode.replaceChild(doc.createTextNode("\n"), brs[i]);
  const blocks = body.querySelectorAll("p,div,tr,li,h1,h2,h3,h4,h5,h6");
  for (let i = 0; i < blocks.length; i++) blocks[i].appendChild(doc.createTextNode("\n"));
  const cells = body.querySelectorAll("td,th");
  for (let i = 0; i < cells.length; i++) cells[i].appendChild(doc.createTextNode("  "));
  return body.textContent || "";
}

/* ---- 厦大马校课表页（table.data：表头 Time + Monday…Sunday；时间列 "9.00am-10.00am"；课程格 td.row_kb 带 rowspan，内容用 <br> 分行） ---- */
const SLOT_RE_SRC = "(\\d{1,2})[.:](\\d{2})\\s*([ap]\\.?m\\.?)?\\s*(?:[-–—~～至到]|to)\\s*(\\d{1,2})[.:](\\d{2})\\s*([ap]\\.?m\\.?)?";
const COURSE_CODE_RE = /^[A-Za-z]{1,6}\s?\d{2,5}[A-Za-z]?$/;
const DAY_NAMES = ["日", "一", "二", "三", "四", "五", "六"];

function snippet(t) {
  return String(t || "").replace(/\s+/g, " ").slice(0, 60);
}

function kbFromMatrix(m, diag) {
  let hdr = -1;
  let dayCols = {};
  for (let r = 0; r < Math.min(m.length, 6); r++) {
    const row = m[r] || [];
    const found = {};
    let n = 0;
    for (let c = 0; c < row.length; c++) {
      if (!row[c]) continue;
      const d = dayFromLabel(row[c].text);
      if (d >= 0) { found[c] = d; n++; }
    }
    if (n >= 3) { hdr = r; dayCols = found; break; }
  }
  if (hdr < 0) return null;
  const cols = Object.keys(dayCols).map(Number);
  const firstDayCol = Math.min.apply(null, cols);

  const slotOf = (row) => {
    if (!row) return null;
    for (let c = 0; c < firstDayCol; c++) {
      if (!row[c]) continue;
      const tm = new RegExp(SLOT_RE_SRC, "i").exec(row[c].text);
      if (tm) { const t = timeFromMatch(tm); if (t) return t; }
    }
    return null;
  };
  let slotRows = 0;
  for (let r = hdr + 1; r < m.length; r++) if (slotOf(m[r])) slotRows++;
  if (slotRows < 2) return null;

  const out = [];
  const done = [];
  for (let r = hdr + 1; r < m.length; r++) {
    const row = m[r] || [];
    cols.forEach((c) => {
      const cell = row[c];
      if (!cell || done.indexOf(cell) >= 0) return;
      done.push(cell);
      const text = (cell.text || "").trim();
      if (!text) return;
      const where = "第 " + (cell.r0 + 1) + " 行 · 周" + DAY_NAMES[dayCols[c]] + " 列";
      const t0 = slotOf(m[cell.r0]);
      const t1 = slotOf(m[Math.min(cell.r0 + cell.rs - 1, m.length - 1)]);
      if (!t0 || !t1 || toMin(t1.end) <= toMin(t0.start)) {
        diag.push(where + "：找不到这门课对应的时间段（片段：" + snippet(text) + "）");
        return;
      }
      const lines = text.split("\n").map((l) => l.trim()).filter(Boolean);
      let code = "", room = "", weeks = "";
      const rest = [];
      lines.forEach((ln) => {
        if (/^\(?\s*weeks?\b/i.test(ln)) { weeks = ln.replace(/^\(?\s*weeks?\s*/i, "").replace(/\)\s*$/, "").trim(); return; }
        if (!room && ln.indexOf("#") >= 0) { room = ln; return; }
        if (!code && COURSE_CODE_RE.test(ln)) { code = ln; return; }
        rest.push(ln);
      });
      const name = (code + " " + (rest[0] || "")).trim();
      if (!name) {
        diag.push(where + "：没有读到课程名称（片段：" + snippet(text) + "）");
        return;
      }
      if (!room) diag.push(where + "：「" + name + "」没有找到教室（片段：" + snippet(text) + "），已留空。");
      out.push({ name: name, day: dayCols[c], start: t0.start, end: t1.end, room: room, weeks: weeks, teacher: rest[1] || "" });
    });
  }
  return out;
}

function parseTimetableHtml(html) {
  const diag = [];
  const doc = new DOMParser().parseFromString(html, "text/html");
  const junk = doc.querySelectorAll("script,style,noscript");
  for (let i = 0; i < junk.length; i++) junk[i].parentNode.removeChild(junk[i]);

  let items = [];
  let strategy = "";
  const tables = doc.querySelectorAll("table");
  console.log("[XMUM 课表] 页面中共有 " + tables.length + " 张表格；带 row_kb 的课程格：" + doc.querySelectorAll("td.row_kb").length);

  for (let i = 0; i < tables.length && !strategy; i++) {
    const t = tables[i];
    if (t.querySelector("table")) continue;
    try {
      const got = kbFromMatrix(tableMatrix(t), diag);
      if (got && got.length) { items = got; strategy = "XMUM 课表表格（第 " + (i + 1) + " 张）"; }
    } catch (err) {
      diag.push("第 " + (i + 1) + " 张表格解析出错：" + (err && err.message ? err.message : err));
      console.log("[XMUM 课表] 表格解析异常", err);
    }
  }

  if (!strategy) {
    for (let i = 0; i < tables.length; i++) {
      const t = tables[i];
      if (t.querySelector("table")) continue;
      const m = tableMatrix(t);
      let got = gridSlots(m);
      if (got === null) got = listSlots(m);
      if (got === null) got = rowFallback(m);
      items = items.concat(got);
    }
    if (items.length) strategy = "通用表格识别";
  }
  if (items.length === 0) {
    const txt = bodyText(doc);
    items = parseTimetable(txt).map((s) => ({ name: s.name, day: s.day, start: s.start, end: s.end, room: "" }));
    if (items.length) strategy = "纯文本识别";
    else {
      diag.push("页面共 " + tables.length + " 张表格，没有找到“星期表头 + 时间列”（Time / Monday … Sunday）。");
      diag.push("页面文字片段：" + snippet(txt.slice(0, 200)));
      console.log("[XMUM 课表] 没有识别到课程。页面文本片段：", txt.replace(/\s+/g, " ").slice(0, 400));
    }
  }
  const seen = {};
  const result = items.filter((s) => {
    const key = s.name + "|" + s.day + "|" + s.start + "|" + s.end + "|" + (s.weeks || "");
    if (seen[key]) return false;
    seen[key] = true;
    return true;
  });
  result.diag = diag;
  console.log("[XMUM 课表] 识别方式：" + (strategy || "无") + "，课程时段：" + result.length, result);
  if (diag.length) console.log("[XMUM 课表] 需要留意的节点：", diag);
  return result;
}

function readHtmlFile(file) {
  return new Promise((resolve, reject) => {
    if (file.size > 6 * 1024 * 1024) { reject(new Error("文件超过 6MB，不像是课表页面")); return; }
    const fr = new FileReader();
    fr.onerror = () => reject(new Error("读取文件失败，请重试"));
    fr.onload = () => {
      try {
        const buf = fr.result;
        let text = new TextDecoder("utf-8").decode(buf);
        const head = text.slice(0, 3000);
        const bad = (text.match(/\uFFFD/g) || []).length;
        if (/charset\s*=\s*["']?\s*(gb2312|gbk|gb18030)/i.test(head) || bad > 3) {
          try { text = new TextDecoder("gb18030").decode(buf); } catch (e) {}
        }
        resolve(text);
      } catch (e) { reject(new Error("无法解码该文件")); }
    };
    fr.readAsArrayBuffer(file);
  });
}

function legacyRoom() {

    for (const k of ["xmum_dorm_room", "xmum_room"]) {

function ServiceHall({ myRoom }) {
  const [open, setOpen] = useState(false);
  const [issue, setIssue] = useState("");
  const [copiedKey, copy] = useCopy();
  const touchY = useRef(null);

  const roomT = (myRoom || "").trim();
  const repairText = (r, i) => "[报修] " + r + " - " + i;
  const focusRoom = () => {
    const el = document.getElementById("my-room-input");
    if (el) { el.scrollIntoView({ block: "center", behavior: "smooth" }); el.focus(); }
  };
  const pick = (i) => {
    if (!roomT) { focusRoom(); return; }
    setIssue(i);
    copy("repair", repairText(roomT, i));
  };

  const onTouchStart = (e) => { touchY.current = e.touches[0].clientY; };
  const onTouchEnd = (e) => {
    if (touchY.current === null) return;
    const dy = e.changedTouches[0].clientY - touchY.current;
    touchY.current = null;
    if (dy > 40) setOpen(true);
    else if (dy < -40) setOpen(false);
  };

  return (
    <div className="mb-3">
      <div onTouchStart={onTouchStart} onTouchEnd={onTouchEnd}>
        <button type="button" onClick={() => setOpen(!open)} aria-expanded={open} aria-controls="service-hall"
          className="flex min-h-[44px] w-full items-center justify-center gap-1.5 rounded-xl border border-zinc-800 bg-zinc-900 px-4 py-2 text-sm font-semibold text-zinc-100 active:bg-zinc-800">
          {open ? <I.ChevronUp size={16} /> : <I.ChevronDown size={16} />}
          {open ? "收起二楼" : "下拉展开二楼"}
          <span className="text-xs font-normal text-zinc-400">报修 · 热线</span>
        </button>
      </div>

      {open && (
        <div id="service-hall" className="hall mt-2 flex flex-col gap-3">
          <Card>
            <CardTitle icon={<I.Wrench size={16} />} title="宿舍报修" tone="bg-orange-400/15 text-orange-300" />
            <div className="flex flex-wrap gap-2" role="group" aria-label="常见报修项目">
              {REPAIR_ISSUES.map((x) => (
                <button key={x} type="button" aria-pressed={issue === x} onClick={() => pick(x)}
                  className={"min-h-[40px] whitespace-nowrap rounded-full border px-3.5 py-1.5 text-sm " +
                    (issue === x ? "border-orange-400 bg-orange-400 font-semibold text-zinc-950" : "border-zinc-700 bg-zinc-950 text-zinc-200 active:bg-zinc-800")}>{x}</button>
              ))}
            </div>
            <p className="mt-2.5 min-h-[20px] break-words text-xs text-zinc-400" role="status">
              {!roomT ? "先在上方填“我的宿舍”" : copiedKey === "repair" ? "✅ 已复制：" + repairText(roomT, issue) : "点选问题，自动复制报修文字"}
            </p>
            <div className="mt-2 grid grid-cols-2 gap-2">
              <a href={"tel:" + MAINT_DIAL}
                className="flex min-h-[46px] items-center justify-center gap-1.5 whitespace-nowrap rounded-xl bg-emerald-400 px-2 py-2 text-sm font-bold text-zinc-950 active:bg-emerald-300">
                📞 一键呼叫
              </a>
              <a href={MAINT_URL} target="_blank" rel="noopener noreferrer"
                className="flex min-h-[46px] items-center justify-center gap-1.5 whitespace-nowrap rounded-xl bg-sky-400 px-2 py-2 text-sm font-bold text-zinc-950 active:bg-sky-300">
                🌐 官方报修系统
              </a>
            </div>
          </Card>

          <Card>
            <CardTitle icon={<I.Phone size={16} />} title="紧急热线" tone="bg-red-400/15 text-red-300" />
            <ul className="flex flex-col gap-2">
              {HOTLINES.map((x) => <HotlineRow key={x.key} h={x} copiedKey={copiedKey} copy={copy} />)}
            </ul>
          </Card>
        </div>
      )}
    </div>
  );
}
/* ------------------------------ 3. 智能课程与签到 ------------------------------ */
function CalBanner({ info, cal }) {
  let cls = "border-sky-400/30 bg-sky-400/5 text-sky-100";
  let text = "";
  if (info.phase === "teaching") {
    text = "📅 第 " + info.week + " 教学周 · " + cal.semester + " 学期";
    if (info.holiday) { text += " · 🎉 今天是 " + info.holiday + "，课程暂停"; cls = "border-amber-400/40 bg-amber-400/10 text-amber-100"; }
  } else if (info.phase === "recess") {
    text = "🌴 本周为期中假期 (Recess Break)，常规课程暂停"; cls = "border-amber-400/40 bg-amber-400/10 text-amber-100";
  } else if (info.phase === "before") {
    text = "学期还没开始：Week 1 将在 " + info.days + " 天后开始";
  } else if (info.phase === "after") {
    text = "教学周已结束，进入复习 / 考试周，常规课程不再显示";
  } else {
    text = "还没有设置开学首日，点右上角“校历设置”填写";
  }
  return <p className={"mb-3 rounded-lg border px-3 py-2 text-sm font-medium leading-snug " + cls} role="status">{text}</p>;
}

function CourseCard({ attendDefault, now, cal, onCal, onFull, courses, onImport, onManage, customized }) {
  const sec = Math.floor(now.getTime() / 1000);
  const status = useMemo(() => getCourseStatus(courses, now, cal), [courses, cal.start, cal.recessFrom, cal.recessTo, cal.teachEnd, sec]);
  const info = academicInfo(cal, now);
  const todayList = courses.filter((c) => c.day === now.getDay() && courseOn(c, now, cal)).sort((a, b) => toMin(a.start) - toMin(b.start));

  let body = null;
  let attendUrl = "";
  let moodleUrl = MOODLE_HOME;

  if (!status) {
    body = (
      <div className="rounded-xl border border-dashed border-zinc-700 p-4 text-center">
        <p className="text-base font-medium text-zinc-100">暂无课程安排</p>
        <p className="mt-1 text-sm text-zinc-400">点下方“智能导入课表”</p>
      </div>
    );
  } else {
    const c = status.course;
    attendUrl = normalizeUrl(c.attendUrl) || normalizeUrl(attendDefault);
    moodleUrl = normalizeUrl(c.moodleUrl) || MOODLE_HOME;
    const isNow = status.kind === "now";
    const dayLabel = status.off === 0 ? "今天" : status.off === 1 ? "明天" : WEEKDAYS[c.day];
    body = (
      <div className={"rounded-xl border p-3.5 " + (isNow ? "border-emerald-400/50 bg-emerald-400/5" : "border-sky-400/40 bg-sky-400/5")}>
        <div className="flex items-center justify-between gap-2">
          <span className={"inline-flex items-center gap-1.5 rounded-full px-2.5 py-1 text-xs font-semibold " +
            (isNow ? "bg-emerald-400/20 text-emerald-300" : "bg-sky-400/20 text-sky-300")}>
            <span className={"h-1.5 w-1.5 rounded-full " + (isNow ? "bg-emerald-300" : "bg-sky-300")} />
            {isNow ? "当前课程" : "下一堂课"}
          </span>
          <span className="text-xs text-zinc-300">{dayLabel}</span>
        </div>
        <p className="mt-3 break-words text-lg font-bold leading-snug text-zinc-50">{c.name}</p>
        <p className="tnum mt-1 text-sm text-zinc-300">{c.start} – {c.end}{c.room ? " · " + c.room : ""}</p>
        <p className="mt-3 text-sm font-semibold text-zinc-100">
          {isNow ? "距离下课还有 " : "距离上课还有 "}
          <span className={"tnum " + (isNow ? "text-emerald-300" : "text-sky-300")}>{fmtDur(status.mins)}</span>
        </p>
      </div>
    );
  }

  return (
    <Card>
      <CardTitle icon={<I.Book size={18} />} title="智能课表" tone="bg-sky-400/15 text-sky-300"
        right={<span className="flex shrink-0 items-center gap-1.5">
          <button type="button" onClick={onFull}
            className="inline-flex min-h-[36px] items-center gap-1 rounded-lg border border-sky-400/50 bg-sky-400/10 px-2.5 py-1 text-xs font-semibold text-sky-200 active:bg-sky-400/20">📋 完整课表</button>
          <button type="button" onClick={onCal} aria-label="校历设置"
            className="inline-flex min-h-[36px] items-center gap-1 rounded-lg border border-zinc-600 px-2 py-1 text-xs font-semibold text-zinc-100 active:bg-zinc-800">⚙️ 校历设置</button>
        </span>} />
      <CalBanner info={info} cal={cal} />
      {body}
      {todayList.length > 0 && (
        <ul className="mt-3 flex flex-col gap-1.5" aria-label="今天的课程">
          {todayList.map((c) => {
            const nowMin = now.getHours() * 60 + now.getMinutes();
            const live = toMin(c.start) <= nowMin && nowMin < toMin(c.end);
            return (
              <li key={c.id} className={"flex items-center justify-between gap-2 rounded-lg border px-3 py-2 text-xs " + (live ? "border-emerald-400/50 bg-emerald-400/10 text-emerald-100" : "border-zinc-800 bg-zinc-950 text-zinc-300")}>
                <span className="min-w-0 truncate font-semibold">{c.name}</span>
                <span className="tnum shrink-0">{c.start}–{c.end}{c.weeks ? " · W" + c.weeks : ""}</span>
              </li>
            );
          })}
        </ul>
      )}

      <div className="mt-3 flex flex-col gap-2.5">
        {/* 按钮 A：一键签到 */}
        {attendUrl ? (
          <a href={attendUrl} target="_blank" rel="noopener noreferrer"
            className="flex min-h-[48px] items-center justify-center gap-2 rounded-xl bg-emerald-400 px-4 py-2.5 text-base font-bold text-zinc-950 shadow-[0_0_0_3px_rgba(52,211,153,0.2)] active:bg-emerald-300">
            📍 一键签到 (Attendance)
          </a>
        ) : (
          <button type="button" onClick={onManage}
            className="flex min-h-[48px] items-center justify-center gap-2 rounded-xl bg-emerald-400 px-4 py-2.5 text-base font-bold text-zinc-950 shadow-[0_0_0_3px_rgba(52,211,153,0.2)] active:bg-emerald-300">
            📍 一键签到 (Attendance)
          </button>
        )}
        {!attendUrl && status && <p className="-mt-1 text-xs text-zinc-400">签到链接填一次即可（点上方按钮）</p>}

        {/* 按钮 B：Moodle 课程页（独立按钮） */}
        <a href={moodleUrl} target="_blank" rel="noopener noreferrer"
          className="flex min-h-[48px] items-center justify-center gap-2 rounded-xl border border-zinc-600 bg-zinc-800 px-4 py-3 text-base font-semibold text-zinc-50 active:bg-zinc-700">
          📚 Moodle 课程页
        </a>
      </div>

      <div className="mt-3 grid grid-cols-2 gap-2.5 border-t border-zinc-800 pt-3">
        <button type="button" onClick={onImport}
          className="flex min-h-[44px] items-center justify-center gap-1.5 rounded-xl border border-sky-400/50 bg-sky-400/10 px-3 py-2 text-sm font-semibold text-sky-200 active:bg-sky-400/20">
          ⚡ 智能导入课表
        </button>
        <button type="button" onClick={onManage}
          className="flex min-h-[44px] items-center justify-center gap-1.5 rounded-xl border border-zinc-700 bg-zinc-950 px-3 py-2 text-sm font-medium text-zinc-100 active:bg-zinc-800">
          <I.Pencil size={14} /> 课表与链接
        </button>
      </div>
      {!customized && <p className="mt-2.5 text-xs text-zinc-400">当前显示的是示范课表，导入你的课表后会自动替换；课程数据只保存在本机浏览器。</p>}
    </Card>
  );
}

function ImportModal({ customized, onApply, onFileApply, onManual, onClose }) {

  const [mode, setMode] = useState(customized ? "append" : "replace");
  const [busy, setBusy] = useState(false);
  const [fileErr, setFileErr] = useState("");
  const [fileDiag, setFileDiag] = useState([]);
  const [drag, setDrag] = useState(false);
  const parsed = useMemo(() => {
    const tx = parseTimetable(text);
    if (tx.length === 0 && /<\/?(table|tr|td|th|div|span|body|html)\b/i.test(text)) {
      try {
        const hi = parseTimetableHtml(text);
        if (hi && hi.length) { hi.skipped = tx.skipped; return hi; }
      } catch (e) { console.log("[XMUM 课表] HTML 解析失败", e); }
    }
    return tx;
  }, [text]);
  const skipped = parsed.skipped || [];

  useEffect(() => {
    const onKey = (e) => { if (e.key === "Escape") onClose(); };
    window.addEventListener("keydown", onKey);
    return () => window.removeEventListener("keydown", onKey);
  }, [onClose]);

  const handleFile = async (file) => {
    if (!file) return;
    setFileErr("");
    setFileDiag([]);
    if (!/\.(html?|xhtml)$/i.test(file.name) && file.type !== "text/html") {
      setFileErr("请选择 .html 或 .htm 文件（教务系统课表页面另存而来）。");
      return;
    }
    setBusy(true);
    try {
      const html = await readHtmlFile(file);
      const items = parseTimetableHtml(html);
      if (items.length === 0) {
        setFileErr("解析失败：没有在这个文件里找到“星期 + 时间段”的课程。请确认保存的是课表页面本身，或改用下方的粘贴文本。");
        setFileDiag((items.diag || []).slice(0, 8));
      } else {
        onFileApply(items, file.name, (items.diag || []).length);
      }
    } catch (err) {
      console.log("[XMUM 课表] 读取或解析失败", err);
      setFileErr("解析失败：" + (err && err.message ? err.message : "读取文件时出错，请重试"));
    }
    setBusy(false);
  };

  const sorted = parsed.slice().sort((a, b) =>
    DAY_ORDER.indexOf(a.day) - DAY_ORDER.indexOf(b.day) || toMin(a.start) - toMin(b.start));

  return (
    <div className="fixed inset-0 z-50 flex items-end justify-center sm:items-center" role="dialog" aria-modal="true" aria-label="智能导入课表">
      <button type="button" aria-label="关闭" onClick={onClose} className="absolute inset-0 bg-black/70" />
      <div className="sheet relative z-10 flex max-h-[92%] w-full max-w-xl flex-col overflow-hidden rounded-t-2xl border border-zinc-800 bg-zinc-900 sm:rounded-2xl"
        style={{ paddingBottom: "env(safe-area-inset-bottom, 0px)" }}>
        <div className="flex items-center justify-between gap-3 border-b border-zinc-800 px-4 py-3">
          <div className="min-w-0">
            <h2 className="text-base font-semibold text-zinc-50">⚡ 智能导入课表</h2>
            <p className="text-xs text-zinc-400">仅在本机解析，不上传</p>
          </div>
          <button type="button" onClick={onClose} aria-label="关闭"
            className="flex h-10 w-10 items-center justify-center rounded-lg border border-zinc-700 text-zinc-200 active:bg-zinc-800"><I.X size={18} /></button>
        </div>

        <div className="min-h-0 flex-1 overflow-y-auto px-4 py-4">
          <label htmlFor="file-in"
            onDragOver={(e) => { e.preventDefault(); setDrag(true); }}
            onDragLeave={() => setDrag(false)}
            onDrop={(e) => { e.preventDefault(); setDrag(false); handleFile(e.dataTransfer && e.dataTransfer.files ? e.dataTransfer.files[0] : null); }}
            className={"flex min-h-[132px] cursor-pointer flex-col items-center justify-center gap-2 rounded-2xl border-2 border-dashed px-4 py-5 text-center " +
              (drag ? "border-sky-400 bg-sky-400/10" : "border-zinc-600 bg-zinc-950 active:bg-zinc-800")}>
            <span className="flex h-11 w-11 items-center justify-center rounded-full bg-sky-400/15 text-sky-300"><I.Upload size={22} /></span>
            <span className="text-base font-semibold text-zinc-50">{busy ? "正在解析…" : "上传教务课表 HTML 文件"}</span>
            <span className="text-xs text-zinc-400">点击选择 .html 文件</span>
          </label>
          <input id="file-in" type="file" accept=".html,.htm,.xhtml,text/html" className="sr-only"
            onChange={(e) => { const f = e.target.files && e.target.files[0]; e.target.value = ""; handleFile(f); }} />
          {fileErr && (
            <div className="mt-2 rounded-lg border border-red-400/40 bg-red-400/10 px-3 py-2 text-sm leading-relaxed text-red-200" role="alert">
              <p>{fileErr}</p>
              {fileDiag.length > 0 && (
                <ul className="mt-1.5 list-disc space-y-1 pl-5 text-xs text-red-100/90">
                  {fileDiag.map((d, k) => <li key={k} className="break-words">{d}</li>)}
                </ul>
              )}
              <p className="mt-1.5 text-xs text-red-100/70">已把解析到的文字片段打印到浏览器控制台（[XMUM 课表]），方便排查。</p>
            </div>
          )}

          <div className="my-5 flex items-center gap-3 text-xs text-zinc-400">
            <span className="h-px flex-1 bg-zinc-800" />或粘贴文本<span className="h-px flex-1 bg-zinc-800" />
          </div>

          <label htmlFor="paste-box" className={labelCls}>粘贴课表文本或网页源码</label>
          <textarea id="paste-box" value={text} onChange={(e) => setText(e.target.value)} rows={5}
            className={inputCls + " resize-y font-mono text-sm leading-relaxed"} placeholder={"例如：\n" + SAMPLE_PASTE} />
          <div className="mt-2 flex items-center justify-between gap-3">
            <p className="text-xs text-zinc-400">自动忽略“已缴费/Paid”、学期号与多余标签</p>
            <button type="button" onClick={() => setText(SAMPLE_PASTE)} className="shrink-0 rounded-lg border border-zinc-700 px-2.5 py-1.5 text-xs text-zinc-200 active:bg-zinc-800">填入示例</button>
          </div>

          <div className="mt-4 flex items-center justify-between">
            <h3 className="text-sm font-semibold text-zinc-100">识别结果：{sorted.length} 个时段</h3>
            <div className="inline-flex overflow-hidden rounded-lg border border-zinc-700 text-xs">
              <button type="button" onClick={() => setMode("append")} aria-pressed={mode === "append"}
                className={"px-3 py-1.5 " + (mode === "append" ? "bg-sky-400 font-semibold text-zinc-950" : "bg-zinc-950 text-zinc-300")}>追加</button>
              <button type="button" onClick={() => setMode("replace")} aria-pressed={mode === "replace"}
                className={"px-3 py-1.5 " + (mode === "replace" ? "bg-sky-400 font-semibold text-zinc-950" : "bg-zinc-950 text-zinc-300")}>替换现有</button>
            </div>
          </div>
          {skipped.length > 0 && (
            <div className="mt-2 rounded-lg border border-amber-400/40 bg-amber-400/10 px-3 py-2 text-xs leading-relaxed text-amber-100" role="status">
              <p>有 {skipped.length} 行没能识别，已跳过，不影响其他课程：</p>
              <ul className="mt-1 list-disc space-y-0.5 pl-5">
                {skipped.slice(0, 5).map((s, k) => <li key={k} className="break-words">{s.n > 0 ? "第 " + s.n + " 行" : "整体"}：{s.reason}{s.text ? "（" + s.text + "）" : ""}</li>)}
              </ul>
            </div>
          )}
          <button type="button" onClick={onManual} className="mt-2 flex min-h-[42px] w-full items-center justify-center gap-1.5 rounded-xl border border-zinc-700 px-3 py-2 text-sm font-medium text-zinc-100 active:bg-zinc-800">
            <I.Plus size={16} /> 手动添加一门课
          </button>
          <ul className="mt-2 flex flex-col gap-2">
            {sorted.map((c, i) => (
              <li key={i} className="flex items-center justify-between gap-3 rounded-xl border border-zinc-800 bg-zinc-950 px-3 py-2.5">
                <span className="min-w-0 truncate text-sm font-medium text-zinc-50">{c.name}</span>
                <span className="tnum shrink-0 text-xs text-zinc-300">{WEEKDAYS[c.day]} {c.start}–{c.end}</span>
              </li>
            ))}
            {text.trim() && sorted.length === 0 && (
              <li className="rounded-xl border border-dashed border-zinc-700 p-3 text-sm text-zinc-300">没识别到“星期 + 时间段”，可检查文本，或点上方“手动添加一门课”。</li>
            )}
            {!text.trim() && <li className="rounded-xl border border-dashed border-zinc-700 p-3 text-sm text-zinc-400">粘贴后，识别结果显示在这里。</li>}
          </ul>
        </div>

        <div className="border-t border-zinc-800 px-4 py-3">
          <button type="button" disabled={sorted.length === 0} onClick={() => onApply(sorted, mode)}
            className={"flex min-h-[48px] w-full items-center justify-center gap-2 rounded-xl px-4 py-3 text-base font-semibold " +
              (sorted.length ? "bg-sky-400 text-zinc-950 active:bg-sky-300" : "cursor-not-allowed bg-zinc-800 text-zinc-500")}>
            <I.Check size={18} /> 导入粘贴内容（{sorted.length} 个时段）
          </button>
        </div>
      </div>
    </div>
  );
}


/* ------------------------------ 完整课表：周视图 / 日列表 / .ics 导出 ------------------------------ */
const TT_COLORS = [
  { bg: "rgba(143,176,150,0.34)", line: "rgba(178,208,184,0.70)" },
  { bg: "rgba(198,142,154,0.32)", line: "rgba(228,176,186,0.70)" },
  { bg: "rgba(206,182,132,0.32)", line: "rgba(232,212,166,0.70)" },
  { bg: "rgba(132,162,194,0.34)", line: "rgba(168,196,226,0.70)" },
  { bg: "rgba(168,152,204,0.32)", line: "rgba(198,184,232,0.70)" },
  { bg: "rgba(204,152,124,0.32)", line: "rgba(230,184,158,0.70)" },
];
const TT_HOUR_H = 44;
const TT_DAYS = ["Mon", "Tue", "Wed", "Thu", "Fri", "Sat", "Sun"];
const TT_DAY_CN = ["周一", "周二", "周三", "周四", "周五", "周六", "周日"];

function ttCode(c) {
  const m = /^[A-Za-z]{1,6}\s?\d{2,5}[A-Za-z]?/.exec(c.name || "");
  return m ? m[0] : (c.name || "").slice(0, 6);
}
function ttTitle(c) {
  const code = ttCode(c);
  const rest = (c.name || "").slice(code.length).trim();
  return rest || c.name;
}
function ttColor(c) {
  const code = ttCode(c);
  let h = 0;
  for (let i = 0; i < code.length; i++) h = (h * 31 + code.charCodeAt(i)) % 997;
  return TT_COLORS[h % TT_COLORS.length];
}
function addDays(d, n) {
  return new Date(d.getFullYear(), d.getMonth(), d.getDate() + n);
}

/* 第 w 教学周的周一（放假周不计入周次，所以放假之后的周要往后顺延） */
function weekMonday(cal, w) {
  const st = parseYmd(cal.start) || new Date();
  const mon = addDays(st, -((st.getDay() + 6) % 7));
  let shift = 0;
  const rf = parseYmd(cal.recessFrom);
  const rt = parseYmd(cal.recessTo);
  if (rf && rt && daysBetween(rf, rt) >= 0) {
    const recessWeekIdx = Math.floor(daysBetween(st, rf) / 7) + 1;
    if (w >= recessWeekIdx) shift = Math.ceil((daysBetween(rf, rt) + 1) / 7);
  }
  return addDays(mon, (w - 1 + shift) * 7);
}
function totalTeachWeeks(cal) {
  const st = parseYmd(cal.start);
  const end = parseYmd(cal.teachEnd);
  if (!st || !end) return 14;
  let n = Math.ceil((daysBetween(st, end) + 1) / 7);
  const rf = parseYmd(cal.recessFrom);
  const rt = parseYmd(cal.recessTo);
  if (rf && rt && daysBetween(rf, rt) >= 0) n -= Math.ceil((daysBetween(rf, rt) + 1) / 7);
  return Math.max(1, Math.min(30, n));
}

/* 生成 iCalendar 文本：马来西亚 UTC+8 无夏令时，直接换算成 UTC，导入任何日历都不会错位 */
function buildIcs(courses, cal) {
  const st = parseYmd(cal.start);
  const end = parseYmd(cal.teachEnd);
  const lines = ["BEGIN:VCALENDAR", "VERSION:2.0", "PRODID:-//XMUM Helper//Timetable//ZH", "CALSCALE:GREGORIAN", "X-WR-CALNAME:XMUM " + cal.semester + " 课表"];
  const esc = (t) => String(t || "").replace(/\\/g, "\\\\").replace(/;/g, "\;").replace(/,/g, "\\,").replace(/\n/g, "\\n");
  const utc = (d, hhmm) => {
    const p = hhmm.split(":");
    const t = new Date(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate(), parseInt(p[0], 10) - 8, parseInt(p[1], 10), 0));
    return t.getUTCFullYear() + pad(t.getUTCMonth() + 1) + pad(t.getUTCDate()) + "T" + pad(t.getUTCHours()) + pad(t.getUTCMinutes()) + "00Z";
  };
  let count = 0;
  if (st && end) {
    const span = Math.min(400, daysBetween(st, end));
    for (let k = 0; k <= span; k++) {
      const d = addDays(st, k);
      courses.forEach((c) => {
        if (c.day !== d.getDay() || !courseOn(c, d, cal)) return;
        lines.push("BEGIN:VEVENT");
        lines.push("UID:" + c.id + "-" + ymdOf(d) + "@xmum-helper");
        lines.push("DTSTAMP:" + utc(new Date(), "08:00"));
        lines.push("DTSTART:" + utc(d, c.start));
        lines.push("DTEND:" + utc(d, c.end));
        lines.push("SUMMARY:" + esc(c.name));
        if (c.room) lines.push("LOCATION:" + esc(c.room + ", Xiamen University Malaysia"));
        const desc = [c.teacher ? "Lecturer: " + c.teacher : "", c.weeks ? "Weeks " + c.weeks : ""].filter(Boolean).join("\n");
        if (desc) lines.push("DESCRIPTION:" + esc(desc));
        lines.push("END:VEVENT");
        count++;
      });
    }
  }
  lines.push("END:VCALENDAR");
  return { text: lines.join("\r\n") + "\r\n", count: count };
}

function WeekGrid({ days, courses, cal, now, onPick }) {
  let minH = 8;
  let maxH = 20;
  const per = days.map((d) => courses.filter((c) => c.day === d.getDay() && courseOn(c, d, cal)));
  per.forEach((list) => list.forEach((c) => {
    minH = Math.min(minH, Math.floor(toMin(c.start) / 60));
    maxH = Math.max(maxH, Math.ceil(toMin(c.end) / 60));
  }));
  const H = (maxH - minH) * TT_HOUR_H;
  const hours = [];
  for (let h = minH; h <= maxH; h++) hours.push(h);
  const todayKey = ymdOf(now);
  const tpl = { display: "grid", gridTemplateColumns: "34px repeat(7, minmax(60px, 1fr))" };
  const nowMin = now.getHours() * 60 + now.getMinutes();
  return (
    <div className="overflow-x-auto pb-2" style={{ WebkitOverflowScrolling: "touch" }}>
      <div style={{ minWidth: 460 }}>
        <div style={tpl} className="sticky top-0 z-10 border-b border-zinc-800 bg-zinc-950">
          <div />
          {days.map((d, i) => {
            const isToday = ymdOf(d) === todayKey;
            const hol = CAL_HOLIDAYS[ymdOf(d)];
            return (
              <div key={i} className={"py-1.5 text-center " + (isToday ? "rounded-t-lg bg-sky-400/15" : "")}>
                <p className={"text-[11px] font-semibold " + (isToday ? "text-sky-200" : "text-zinc-400")}>{TT_DAYS[i]}</p>
                <p className={"tnum text-xs " + (isToday ? "font-bold text-sky-100" : "text-zinc-300")}>{d.getDate()}{hol ? "🎉" : ""}</p>
              </div>
            );
          })}
        </div>
        <div style={tpl}>
          <div className="relative" style={{ position: "relative", height: H }}>
            {hours.map((h) => (
              <span key={h} className="tnum absolute right-1 text-[9px] text-zinc-500" style={{ position: "absolute", top: (h - minH) * TT_HOUR_H - 5 }}>{pad(h)}:00</span>
            ))}
          </div>
          {days.map((d, i) => {
            const isToday = ymdOf(d) === todayKey;
            const hol = CAL_HOLIDAYS[ymdOf(d)];
            return (
              <div key={i} className="relative border-l border-zinc-800" style={{ position: "relative", height: H, background: isToday ? "rgba(56,189,248,0.06)" : hol ? "rgba(251,191,36,0.05)" : "transparent" }}>
                {hours.map((h) => <div key={h} className="absolute inset-x-0 border-t border-zinc-800/80" style={{ position: "absolute", left: 0, right: 0, top: (h - minH) * TT_HOUR_H }} />)}
                {isToday && nowMin >= minH * 60 && nowMin <= maxH * 60 && (
                  <div className="absolute inset-x-0 z-[5] border-t-2 border-rose-400/80" style={{ position: "absolute", left: 0, right: 0, top: ((nowMin - minH * 60) / 60) * TT_HOUR_H }} />
                )}
                {per[i].map((c) => {
                  const col = ttColor(c);
                  const top = ((toMin(c.start) - minH * 60) / 60) * TT_HOUR_H + 1;
                  const h = ((toMin(c.end) - toMin(c.start)) / 60) * TT_HOUR_H - 2;
                  return (
                    <button key={c.id} type="button" onClick={() => onPick(c, d)} aria-label={"查看 " + c.name + " 详情"}
                      className="tt-block absolute overflow-hidden rounded-lg p-1 text-left"
                      style={{ position: "absolute", left: 2, right: 2, top: top, height: h, background: col.bg, border: "1px solid " + col.line, color: "#f5f5f4" }}>
                      <span className="block truncate text-[11px] font-bold leading-tight">{ttCode(c)}</span>
                      {c.room && <span className="mt-0.5 inline-block max-w-full truncate rounded px-1 text-[9px] leading-tight" style={{ background: "rgba(0,0,0,0.28)" }}>{c.room}</span>}
                      <span className="tnum mt-0.5 block text-[9px] leading-tight opacity-80">{c.start}–{c.end}</span>
                    </button>
                  );
                })}
              </div>
            );
          })}
        </div>
      </div>
    </div>
  );
}

function DayList({ days, idx, setIdx, courses, cal, now, onPick }) {
  const d = days[idx];
  const todayKey = ymdOf(now);
  const list = courses.filter((c) => c.day === d.getDay() && courseOn(c, d, cal)).sort((a, b) => toMin(a.start) - toMin(b.start));
  const info = academicInfo(cal, d);
  const hol = CAL_HOLIDAYS[ymdOf(d)];
  let emptyText = "今日没有安排";
  let emptyIcon = "☕";
  if (info.phase === "recess") { emptyText = "放假周，常规课程暂停"; emptyIcon = "🌴"; }
  else if (hol) { emptyText = hol + " 公共假日，课程暂停"; emptyIcon = "🎉"; }
  else if (info.phase === "before") { emptyText = "学期还没开始"; emptyIcon = "🕰️"; }
  else if (info.phase === "after") { emptyText = "教学周已结束"; emptyIcon = "📖"; }
  return (
    <div>
      <div className="flex gap-2 overflow-x-auto px-4 pb-3 pt-1" role="tablist" aria-label="选择星期" style={{ WebkitOverflowScrolling: "touch" }}>
        {days.map((x, i) => {
          const sel = i === idx;
          const isToday = ymdOf(x) === todayKey;
          return (
            <button key={i} type="button" role="tab" aria-selected={sel} onClick={() => setIdx(i)}
              className={"flex min-h-[62px] min-w-[52px] shrink-0 flex-col items-center justify-center rounded-2xl border px-2 py-1.5 " +
                (sel ? "border-sky-400 bg-sky-400/20 text-sky-100" : "border-zinc-800 bg-zinc-900 text-zinc-300")}>
              <span className="text-[11px] font-semibold">{TT_DAYS[i]}</span>
              <span className="tnum text-base font-bold">{x.getDate()}</span>
              <span className={"mt-0.5 h-1 w-1 rounded-full " + (isToday ? "bg-sky-300" : "bg-transparent")} />
            </button>
          );
        })}
      </div>
      <div className="px-4 pb-4">
        <p className="mb-2 text-xs text-zinc-400">{TT_DAY_CN[idx]} · {d.getMonth() + 1} 月 {d.getDate()} 日 · 共 {list.length} 节</p>
        {list.length === 0 ? (
          <div className="flex flex-col items-center rounded-2xl border border-dashed border-zinc-700 px-4 py-10 text-center">
            <svg width="64" height="64" viewBox="0 0 64 64" aria-hidden="true">
              <ellipse cx="32" cy="54" rx="20" ry="4" fill="#27272a" />

  );
}

function FullTimetable({ now, cal, courses, onClose, onImport }) {
  const info = academicInfo(cal, now);
  const total = totalTeachWeeks(cal);
  const curWeek = info.phase === "teaching" ? info.week : 1;
  const [week, setWeek] = useState(Math.min(total, Math.max(1, curWeek)));
  const [view, setView] = useState("week");
  const [pop, setPop] = useState(null);
  const [icsOpen, setIcsOpen] = useState(false);
  const [copiedKey, copy] = useCopy();
  const monday = weekMonday(cal, week);
  const days = [0, 1, 2, 3, 4, 5, 6].map((i) => addDays(monday, i));
  const todayIdx = days.findIndex((d) => ymdOf(d) === ymdOf(now));
  const [idx, setIdx] = useState(todayIdx >= 0 ? todayIdx : 0);
  const ics = useMemo(() => (icsOpen ? buildIcs(courses, cal) : { text: "", count: 0 }), [icsOpen, courses, cal]);

  useEffect(() => {
    const onKey = (e) => { if (e.key === "Escape") { if (pop) setPop(null); else onClose(); } };
    window.addEventListener("keydown", onKey);
    return () => window.removeEventListener("keydown", onKey);
  }, [onClose, pop]);

  const weekOptions = [];
  for (let w = 1; w <= total; w++) weekOptions.push(w);
  const css = ".tt-sheet{animation:ttUp .28s cubic-bezier(.2,.8,.2,1)}.tt-pop{animation:ttUp .2s ease-out}.tt-block{transition:transform .14s ease,box-shadow .14s ease}.tt-block:active{transform:scale(.97)}.tt-block:hover{box-shadow:0 0 14px rgba(255,255,255,.12)}@keyframes ttUp{from{transform:translateY(24px);opacity:0}to{transform:translateY(0);opacity:1}}@media (prefers-reduced-motion:reduce){.tt-sheet,.tt-pop{animation:none}.tt-block{transition:none}}";

  return (
    <div className="fixed inset-0 z-50 flex items-end justify-center" role="dialog" aria-modal="true" aria-label="完整课表">

      <button type="button" aria-label="关闭" onClick={onClose} className="absolute inset-0 bg-black/60" />
      <div className="tt-sheet relative z-10 flex h-[94%] w-full max-w-xl flex-col overflow-hidden rounded-t-3xl border border-zinc-700 bg-zinc-950"
        style={{ paddingBottom: "env(safe-area-inset-bottom, 0px)" }}>
        <div className="mx-auto mt-2 h-1 w-10 shrink-0 rounded-full bg-zinc-600" />
        <div className="flex items-center justify-between gap-2 px-3 pb-3 pt-2">
          <label className="relative shrink-0">
            <span className="sr-only">选择周次</span>
            <select value={week} onChange={(e) => { setWeek(parseInt(e.target.value, 10)); setIdx(0); }}
              className="min-h-[40px] appearance-none rounded-xl border border-zinc-700 bg-zinc-900 py-1.5 pl-3 pr-7 text-sm font-semibold text-zinc-50">
              {weekOptions.map((w) => <option key={w} value={w}>{"Week " + w + (info.phase === "teaching" && info.week === w ? " · 本周" : "")}</option>)}
            </select>
            <span aria-hidden="true" className="pointer-events-none absolute right-2.5 top-1/2 -translate-y-1/2 text-xs text-zinc-400">▾</span>
          </label>
          <div className="inline-flex overflow-hidden rounded-xl border border-zinc-700 text-xs" role="tablist" aria-label="视图切换">
            <button type="button" role="tab" aria-selected={view === "week"} onClick={() => setView("week")}
              className={"min-h-[40px] px-3 py-1.5 font-semibold " + (view === "week" ? "bg-sky-400 text-zinc-950" : "bg-zinc-900 text-zinc-300")}>📅 周视图</button>
            <button type="button" role="tab" aria-selected={view === "day"} onClick={() => setView("day")}
              className={"min-h-[40px] px-3 py-1.5 font-semibold " + (view === "day" ? "bg-sky-400 text-zinc-950" : "bg-zinc-900 text-zinc-300")}>📋 日列表</button>
          </div>
          <button type="button" onClick={onClose} aria-label="关闭完整课表"
            className="flex h-10 w-10 shrink-0 items-center justify-center rounded-xl border border-zinc-700 text-zinc-200 active:bg-zinc-800"><I.X size={18} /></button>
        </div>

        <div className="min-h-0 flex-1 overflow-y-auto">
          <p className="px-4 pb-2 text-xs text-zinc-400">{cal.semester} 学期 · {monday.getMonth() + 1}/{monday.getDate()} – {addDays(monday, 6).getMonth() + 1}/{addDays(monday, 6).getDate()}</p>
          {view === "week"
            ? <WeekGrid days={days} courses={courses} cal={cal} now={now} onPick={(c, d) => setPop({ c: c, d: d })} />
            : <DayList days={days} idx={idx} setIdx={setIdx} courses={courses} cal={cal} now={now} onPick={(c, d) => setPop({ c: c, d: d })} />}
        </div>

        <div className="grid grid-cols-2 gap-2.5 border-t border-zinc-800 px-3 py-3">
          <button type="button" onClick={() => { onClose(); onImport(); }}

          <button type="button" onClick={() => setIcsOpen(true)}
            className="flex min-h-[44px] items-center justify-center gap-1.5 rounded-xl border border-sky-400/50 bg-sky-400/10 px-2 py-2 text-xs font-semibold text-sky-200 active:bg-sky-400/20">📤 导出 iCalendar (.ics)</button>

          <div className="absolute inset-0 z-20 flex items-end justify-center p-3" role="dialog" aria-modal="true" aria-label="导出 iCalendar">
            <button type="button" aria-label="关闭" onClick={() => setIcsOpen(false)} className="absolute inset-0 bg-black/60" />

                <button type="button" onClick={() => setIcsOpen(false)} aria-label="关闭"
                  className="flex h-9 w-9 shrink-0 items-center justify-center rounded-lg border border-zinc-700 text-zinc-200 active:bg-zinc-800"><I.X size={16} /></button>
              </div>
              <p className="mt-2 text-xs leading-relaxed text-zinc-300">

              </p>
              <textarea id="ics-text" readOnly rows={6} value={ics.text} onFocus={(e) => e.target.select()}
                className="mt-3 min-h-[120px] w-full flex-1 rounded-lg border border-zinc-700 bg-zinc-950 p-2 font-mono text-[11px] text-zinc-200" />
              <button type="button" disabled={!ics.count} onClick={() => copy("ics", ics.text)}
                className={"mt-3 flex min-h-[46px] items-center justify-center gap-2 rounded-xl px-4 py-2.5 text-sm font-bold " + (copiedKey === "ics" ? "bg-emerald-400 text-zinc-950" : ics.count ? "bg-sky-400 text-zinc-950 active:bg-sky-300" : "bg-zinc-800 text-zinc-500")}>
                {copiedKey === "ics" ? <><I.Check size={16} /> 已复制</> : <><I.Copy size={16} /> 复制 .ics 内容</>}
              </button>
              {!ics.count && <p className="mt-2 text-xs text-amber-300">没有可导出的课程，请先导入课表或检查校历设置。</p>}
            </div>
          </div>
        )}
      </div>
    </div>
  );
}
function ManageDrawer({ attendDefault, setAttendDefault, courses, setCourses, markCustom, onClose }) {
  const [form, setForm] = useState({ name: "", days: [1], start: "09:00", end: "11:00" });
  const [error, setError] = useState("");

  useEffect(() => {
    const onKey = (e) => { if (e.key === "Escape") onClose(); };
    window.addEventListener("keydown", onKey);
    return () => window.removeEventListener("keydown", onKey);
  }, [onClose]);

  const groups = useMemo(() => {
    const m = {};
    const order = [];
    courses.forEach((c) => {
      if (!m[c.name]) { m[c.name] = { name: c.name, slots: [], attendUrl: c.attendUrl || "", moodleUrl: c.moodleUrl || "" }; order.push(c.name); }
      m[c.name].slots.push(c);
    });
    return order.map((n) => {
      const g = m[n];
      g.slots.sort((a, b) => DAY_ORDER.indexOf(a.day) - DAY_ORDER.indexOf(b.day) || toMin(a.start) - toMin(b.start));
      return g;
    });
  }, [courses]);

  const toggleDay = (d) => {
    const has = form.days.indexOf(d) >= 0;
    setForm({ ...form, days: has ? form.days.filter((x) => x !== d) : [...form.days, d] });
  };

  const add = (e) => {
    e.preventDefault();
    if (!form.name.trim()) { setError("请输入课程名称"); return; }
    if (form.days.length === 0) { setError("请至少选择一个上课日"); return; }
    if (!form.start || !form.end || toMin(form.end) <= toMin(form.start)) { setError("下课时间必须晚于上课时间"); return; }
    setError("");
    const name = form.name.trim();
    const ref = courses.find((c) => c.name === name);
    const added = form.days.map((d) => ({
      id: uid(), day: d, start: form.start, end: form.end, name: name,
      attendUrl: ref ? ref.attendUrl || "" : "", moodleUrl: ref ? ref.moodleUrl || "" : "",
    }));
    setCourses([...courses, ...added]);
    markCustom();
    setForm({ ...form, name: "" });
  };

  const setLink = (name, field, value) => {
    setCourses(courses.map((c) => (c.name === name ? { ...c, [field]: value } : c)));
    markCustom();
  };
  const removeGroup = (name) => { setCourses(courses.filter((c) => c.name !== name)); markCustom(); };
  const removeSlot = (id) => { setCourses(courses.filter((c) => c.id !== id)); markCustom(); };
  const clearAll = () => { setCourses([]); markCustom(); };

  return (
    <div className="fixed inset-0 z-50 flex items-end justify-center sm:items-center" role="dialog" aria-modal="true" aria-label="课表与链接">
      <button type="button" aria-label="关闭" onClick={onClose} className="absolute inset-0 bg-black/70" />
      <div className="sheet relative z-10 flex max-h-[92%] w-full max-w-xl flex-col overflow-hidden rounded-t-2xl border border-zinc-800 bg-zinc-900 sm:rounded-2xl"
        style={{ paddingBottom: "env(safe-area-inset-bottom, 0px)" }}>
        <div className="flex items-center justify-between gap-3 border-b border-zinc-800 px-4 py-3">
          <div className="min-w-0">
            <h2 className="text-base font-semibold text-zinc-50">课表与链接</h2>
            <p className="text-xs text-zinc-400">为每门课设置签到链接与 Moodle 主页，仅保存在本机</p>
          </div>
          <button type="button" onClick={onClose} aria-label="关闭"
            className="flex h-10 w-10 items-center justify-center rounded-lg border border-zinc-700 text-zinc-200 active:bg-zinc-800"><I.X size={18} /></button>
        </div>

        <div className="min-h-0 flex-1 overflow-y-auto px-4 py-4">
          <div className="mb-4 rounded-xl border border-emerald-400/40 bg-emerald-400/5 p-3">
            <label htmlFor="attend-default" className="mb-1 block text-sm font-semibold text-zinc-50">📍 通用签到链接（填一次，所有课程自动使用）</label>
            <input id="attend-default" type="url" inputMode="url" autoCapitalize="none" autoCorrect="off" value={attendDefault}
              onChange={(e) => setAttendDefault(e.target.value.trim())} className={inputCls} placeholder="粘贴签到页网址 https://" />
            <p className="mt-1.5 text-xs leading-relaxed text-zinc-400">网页沙箱无法联网自动抓取，所以只需手动粘贴这一次；下面某门课单独填写的链接优先。</p>
          </div>
          <div className="flex items-center justify-between">
            <h3 className="text-sm font-semibold text-zinc-100">我的课程（{groups.length} 门）</h3>
            <button type="button" onClick={clearAll} className="rounded-lg border border-zinc-700 px-2.5 py-1.5 text-xs text-zinc-300 active:bg-zinc-800">清空全部</button>
          </div>
          <ul className="mt-2 flex flex-col gap-3">
            {groups.map((g, i) => (
              <li key={g.name} className="rounded-xl border border-zinc-800 bg-zinc-950 p-3">
                <div className="flex items-start justify-between gap-3">
                  <p className="min-w-0 break-words text-sm font-semibold text-zinc-50">{g.name}</p>
                  <button type="button" onClick={() => removeGroup(g.name)} aria-label={"删除课程 " + g.name}
                    className="flex h-8 w-8 shrink-0 items-center justify-center rounded-lg text-zinc-400 active:bg-zinc-800"><I.Trash size={15} /></button>
                </div>
                <div className="mt-1.5 flex flex-wrap gap-1.5">
                  {g.slots.map((s) => (
                    <span key={s.id} className="tnum inline-flex items-center gap-1 rounded-md border border-zinc-700 bg-zinc-900 py-1 pl-2 pr-1 text-xs text-zinc-200">
                      {WEEKDAYS[s.day]} {s.start}–{s.end}
                      <button type="button" onClick={() => removeSlot(s.id)} aria-label="删除该时段" className="flex h-5 w-5 items-center justify-center rounded text-zinc-400 active:bg-zinc-700"><I.X size={12} /></button>
                    </span>
                  ))}
                </div>
                <div className="mt-3 grid grid-cols-1 gap-2.5">
                  <div>
                    <label htmlFor={"lk-a-" + i} className={labelCls}>签到链接</label>
                    <input id={"lk-a-" + i} type="url" inputMode="url" autoCapitalize="none" autoCorrect="off" value={g.attendUrl}
                      onChange={(e) => setLink(g.name, "attendUrl", e.target.value)} className={inputCls} placeholder={attendDefault ? "留空则使用通用链接" : "https://"} />
                  </div>
                  <div>
                    <label htmlFor={"lk-m-" + i} className={labelCls}>Moodle 课程主页</label>
                    <input id={"lk-m-" + i} type="url" inputMode="url" autoCapitalize="none" autoCorrect="off" value={g.moodleUrl}
                      onChange={(e) => setLink(g.name, "moodleUrl", e.target.value)} className={inputCls} placeholder="留空则打开 Moodle 首页" />
                  </div>
                </div>
              </li>
            ))}
            {groups.length === 0 && <li className="rounded-xl border border-dashed border-zinc-700 p-4 text-center text-sm text-zinc-400">还没有课程，可以用“智能导入课表”，或在下方手动添加。</li>}
          </ul>

          <form onSubmit={add} className="mt-5 grid grid-cols-2 gap-3 border-t border-zinc-800 pt-4" noValidate>
            <h3 className="col-span-2 text-sm font-semibold text-zinc-100">手动添加一门课</h3>
            <div className="col-span-2">
              <label htmlFor="c-name" className={labelCls}>课程名称</label>
              <input id="c-name" type="text" value={form.name} onChange={(e) => setForm({ ...form, name: e.target.value })} className={inputCls} placeholder="例如：操作系统" />
            </div>
            <div className="col-span-2">
              <span className={labelCls}>上课日（可多选）</span>
              <div className="flex flex-wrap gap-2">
                {DAY_ORDER.map((d) => {
                  const on = form.days.indexOf(d) >= 0;
                  return (
                    <button key={d} type="button" onClick={() => toggleDay(d)} aria-pressed={on}
                      className={"min-h-[40px] min-w-[48px] rounded-lg border px-3 text-sm font-medium " +
                        (on ? "border-sky-400 bg-sky-400/20 text-sky-200" : "border-zinc-700 bg-zinc-950 text-zinc-300")}>
                      {WEEKDAYS[d]}
                    </button>
                  );
                })}
              </div>
            </div>
            <div>
              <label htmlFor="c-start" className={labelCls}>上课时间</label>
              <input id="c-start" type="time" value={form.start} onChange={(e) => setForm({ ...form, start: e.target.value })} className={inputCls + " tnum"} />
            </div>
            <div>
              <label htmlFor="c-end" className={labelCls}>下课时间</label>
              <input id="c-end" type="time" value={form.end} onChange={(e) => setForm({ ...form, end: e.target.value })} className={inputCls + " tnum"} />
            </div>
            {error && <p className="col-span-2 text-sm text-red-300" role="alert">{error}</p>}
            <button type="submit" className="col-span-2 flex min-h-[46px] items-center justify-center gap-2 rounded-xl bg-sky-400 px-4 py-2.5 text-base font-semibold text-zinc-950 active:bg-sky-300">
              <I.Plus size={18} /> 添加课程
            </button>
          </form>
        </div>
      </div>
    </div>
  );
}
