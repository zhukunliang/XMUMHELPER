<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#022c22">
<meta name="description" content="厦大马校学生的课表、地图、电费、汇率与生活工具箱">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>XMUM 校园助手</title>
<style>
  /* 布局：单列移动优先。状态栏 → 下拉服务大厅 → 课程与签到 → 校园地图（桌面左图右列表 / 手机上图下列表）→ 电费 → 交通 → 页脚。深墨绿玻璃拟态主题。 */
  :root {
    color-scheme: dark;
    --bg: #021a14;
    --fg: #ecfdf5;
    --accent: #2dd4bf;
  }
  html { background: #021a14; }
  body { background: transparent; color: var(--fg); }
  body {
    min-height: 100vh;
    padding-inline: 16px; padding-block: 16px 28px;
    -webkit-text-size-adjust: 100%;
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans SC", "Segoe UI", sans-serif;
    font-size: 15px;
  }
  /* 背景渐变放进 fixed 伪元素：滚动时不重绘（background-attachment:fixed 在安卓上会逐帧重绘） */
  body::before {
    content: ""; position: fixed; inset: 0; z-index: -1; pointer-events: none;
    background:
      radial-gradient(1000px 560px at 8% -6%, rgba(16,185,129,.30), transparent 62%),
      radial-gradient(900px 640px at 100% 32%, rgba(6,78,59,.60), transparent 66%),
      linear-gradient(165deg, #064e3b 0%, #04342a 38%, #021a14 100%);
  }
  .tnum { font-variant-numeric: tabular-nums; }
  input, select, button, textarea { font-family: inherit; }
  input:focus-visible, select:focus-visible, button:focus-visible, a:focus-visible, textarea:focus-visible {
    outline: 2px solid var(--accent); outline-offset: 2px;
  }
  /* 玻璃拟态：大圆角 + 微弱白描边 + 柔和内外阴影 */
  .glass {
    border-radius: 20px;
    border: 1px solid rgba(255,255,255,.12);
    background: linear-gradient(180deg, rgba(255,255,255,.08), rgba(255,255,255,.035));
    box-shadow: 0 14px 34px -10px rgba(0,0,0,.5), inset 0 1px 0 rgba(255,255,255,.10), inset 0 -1px 0 rgba(0,0,0,.18);
  }
  .sheet, .tt-sheet, .tt-pop { background: #052a21 !important; }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
  @keyframes slideUp { from { transform: translateY(24px); opacity: 0; } to { transform: none; opacity: 1; } }
  @keyframes dropDown { from { transform: translateY(-10px); opacity: 0; } to { transform: none; opacity: 1; } }
  .sheet { animation: slideUp .18s ease-out; }
  .hall { animation: dropDown .2s ease-out; }
  .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0,0,0,0); white-space: nowrap; border: 0; }
  .noscrollbar { scrollbar-width: none; }
  .noscrollbar::-webkit-scrollbar { display: none; }

  /* 地图视口：手机固定 240px、溢出隐藏；≥640px 按 16:9 展开 */
  .mapbox { height: 240px; }
  @media (min-width: 640px) { .mapbox { height: auto; aspect-ratio: 16 / 9; } }

  /* 折叠面板：grid 行高 0fr → 1fr 平滑展开 */
  .fold { display: grid; grid-template-rows: 0fr; transition: grid-template-rows .3s cubic-bezier(.4, 0, .2, 1); }
  .fold > div { overflow: hidden; min-height: 0; visibility: hidden; transition: visibility 0s linear .3s; }
  .fold.open { grid-template-rows: 1fr; }
  .fold.open > div { visibility: visible; transition-delay: 0s; }
  @keyframes nbBreath { 0%,100% { box-shadow: 0 0 0 0 rgba(110,231,183,0), 0 0 8px rgba(110,231,183,.25); } 50% { box-shadow: 0 0 0 4px rgba(110,231,183,.12), 0 0 16px rgba(110,231,183,.55); } }
  .nb-breath { animation: nbBreath 2.8s ease-in-out infinite; }
@keyframes fxSpin { to { transform: rotate(360deg); } }
.fx-spin { animation: fxSpin .8s linear infinite; }
@media (prefers-reduced-motion: reduce) { .fx-spin { animation-duration: 2s; } }

/* 小图标按钮：视觉尺寸不变，点击热区向外扩 8–10px（达到约 40–44px） */
.hit { position: relative; }
.hit::after { content: ""; position: absolute; inset: -9px; }
</style>
